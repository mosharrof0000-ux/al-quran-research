<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>আল-কুরআন গবেষণা — সংযুক্ত হোম</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08151b}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="home" src="design-preview-page1-chatbox-robot-demo.html" title="সংযুক্ত হোম পেজ"></iframe><script>const frame=document.getElementById('home');frame.addEventListener('load',()=>{try{const doc=frame.contentDocument;const buttons=doc.querySelectorAll('.choice');if(buttons.length>=2){buttons[1].onclick=()=>{const r=doc.getElementById('researchRobot');r.classList.remove('reacted');void r.offsetWidth;r.classList.add('reacted');const big=doc.getElementById('robot');if(big)big.style.transform='scale(1.18)';setTimeout(()=>{location.href='page-2-research-lab.html'},700)}}}catch(e){console.error('হোম সংযোগ স্থাপন করা যায়নি',e)}});</script></body></html>

<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>আল-কুরআন গবেষণা — হোম প্রিভিউ</title>
<style>
:root{--h:158;--c1:hsl(var(--h) 62% 31%);--c2:hsl(calc(var(--h) + 38) 68% 43%);--c3:hsl(calc(var(--h) + 82) 58% 47%);--text:#fff;--shadow:0 24px 70px #001b1838}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:"Noto Sans Bengali","Noto Sans",system-ui,sans-serif}
body{min-height:100vh;overflow:hidden;color:var(--text);background:hsl(var(--h) 55% 16%);transition:background 8s ease}
.home{position:relative;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:28px;overflow:hidden;background:radial-gradient(circle at 18% 18%,hsl(calc(var(--h) + 35) 70% 52% / .22),transparent 30%),radial-gradient(circle at 85% 78%,hsl(calc(var(--h) + 82) 70% 55% / .18),transparent 34%),linear-gradient(145deg,hsl(var(--h) 58% 15%),hsl(calc(var(--h) + 38) 55% 22%),hsl(calc(var(--h) + 82) 50% 18%));transition:background 8s ease}
.orb{position:absolute;border-radius:50%;filter:blur(2px);pointer-events:none;opacity:.28;animation:float 12s ease-in-out infinite}.orb.one{width:240px;height:240px;top:-90px;right:-70px;background:var(--c3)}.orb.two{width:180px;height:180px;bottom:-65px;left:-50px;background:var(--c2);animation-delay:-5s}
.content{position:relative;z-index:2;width:min(520px,100%);display:flex;flex-direction:column;align-items:center;text-align:center}.logo{width:74px;height:74px;border-radius:25px;display:grid;place-items:center;margin-bottom:20px;background:linear-gradient(145deg,var(--c2),var(--c3));box-shadow:var(--shadow);font-size:30px;font-weight:900;transition:background 8s ease}
h1{font-size:clamp(30px,8vw,48px);line-height:1.25;margin:0;font-weight:900;text-shadow:0 5px 25px #0004}.sub{margin:10px 0 34px;font-size:14px;opacity:.82;line-height:1.8}.buttons{width:100%;display:grid;gap:16px}
.choice{position:relative;isolation:isolate;width:100%;min-height:76px;border:1px solid #ffffff38;border-radius:24px;padding:16px 22px;color:#fff;font:inherit;font-size:20px;font-weight:900;cursor:pointer;overflow:hidden;background:#ffffff16;backdrop-filter:blur(14px);box-shadow:0 15px 45px #0003;transition:transform .25s ease,background .6s ease,border-color .6s ease}.choice:active{transform:scale(.96)}.choice:hover{transform:translateY(-2px);border-color:#ffffff80}.choice .icon{font-size:27px;margin-right:10px;vertical-align:-3px}
.choice.read{color:var(--c1);border:2px solid #fff;background:linear-gradient(135deg,#fff 0%,#f5fff9 48%,#fff 100%);box-shadow:0 10px 35px hsl(var(--h) 80% 55% / .25),0 0 0 1px #ffffffaa inset;transition:color 8s ease}.choice.read::before{content:"";position:absolute;inset:-45%;z-index:-1;background:conic-gradient(from 0deg,transparent 0deg,transparent 300deg,#fff9 330deg,#fff 350deg,transparent 360deg);animation:shine 3.2s linear infinite}.choice.read::after{content:"";position:absolute;top:0;left:-35%;width:22%;height:100%;background:linear-gradient(90deg,transparent,#fff9,transparent);transform:skewX(-18deg);animation:sweep 2.8s ease-in-out infinite}.choice.read .icon{display:inline-block;animation:bookPulse 1.8s ease-in-out infinite}.choice.research{background:linear-gradient(135deg,hsl(calc(var(--h) + 38) 55% 40% / .82),hsl(calc(var(--h) + 82) 55% 42% / .72));transition:background 8s ease}
.robot{position:absolute;z-index:3;right:20px;bottom:18px;width:78px;height:92px;animation:robotFloat 3.2s ease-in-out infinite;filter:drop-shadow(0 12px 18px #0005)}.robot .antenna{position:absolute;left:36px;top:0;width:6px;height:15px;border-radius:6px;background:#fff8}.robot .antenna:after{content:"";position:absolute;left:-3px;top:-6px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 16px #fff}.robot .head{position:absolute;left:7px;top:13px;width:64px;height:51px;border-radius:22px;background:linear-gradient(145deg,#f8ffff,#b9d9df);border:2px solid #ffffffaa;box-shadow:inset 0 -7px 12px #5b8b9633}.robot .eye{position:absolute;top:18px;width:10px;height:14px;border-radius:8px;background:#173b48;animation:blink 4.5s infinite}.robot .eye.left{left:16px}.robot .eye.right{right:16px}.robot .mouth{position:absolute;left:26px;bottom:9px;width:13px;height:6px;border-bottom:3px solid #285464;border-radius:0 0 12px 12px}.robot .body{position:absolute;left:16px;top:67px;width:47px;height:25px;border-radius:14px 14px 10px 10px;background:linear-gradient(145deg,#eaffff,#91c2cc);border:2px solid #ffffff99}.robot .heart{position:absolute;left:18px;top:6px;font-size:11px}.robot .arm{position:absolute;top:70px;width:10px;height:25px;border-radius:10px;background:#c4e2e7}.robot .arm.left{left:6px;transform:rotate(18deg)}.robot .arm.right{right:6px;transform:rotate(-18deg)}
.footer{margin-top:24px;font-size:11px;opacity:.55}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-18px,22px) scale(1.06)}}
@keyframes shine{to{transform:rotate(360deg)}}
@keyframes sweep{0%,15%{left:-35%;opacity:0}35%{opacity:1}70%,100%{left:120%;opacity:0}}
@keyframes bookPulse{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.12) rotate(-3deg)}}
@keyframes robotFloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-9px) rotate(2deg)}}
@keyframes blink{0%,45%,48%,100%{transform:scaleY(1)}46%,47%{transform:scaleY(.12)}}
@media(max-width:420px){.home{padding:22px}.logo{width:64px;height:64px;border-radius:22px;margin-bottom:16px}h1{font-size:30px}.sub{margin-bottom:28px}.choice{min-height:70px;font-size:18px;border-radius:21px}.robot{right:12px;bottom:12px;transform:scale(.88);transform-origin:bottom right}}
</style></head>
<body><main class="home"><div class="orb one"></div><div class="orb two"></div><section class="content" aria-label="আল-কুরআন গবেষণা হোম পেজ"><div class="logo">কু</div><h1>আল-কুরআন গবেষণা</h1><p class="sub">পড়ুন, বুঝুন এবং ভাষাভিত্তিক গবেষণার পথে এগিয়ে যান</p><div class="buttons"><button class="choice read" onclick="location.href='index.html#quran'"><span class="icon">📖</span>কোরআন পড়ুন</button><button class="choice research" onclick="location.href='index.html#research'"><span class="icon">🔎</span>গবেষণা করুন</button></div><div class="footer">রঙ ধীরে ধীরে পরিবর্তিত হবে</div></section><div class="robot" aria-label="সহকারী রোবট"><div class="antenna"></div><div class="head"><span class="eye left"></span><span class="eye right"></span><span class="mouth"></span></div><div class="arm left"></div><div class="arm right"></div><div class="body"><span class="heart">✦</span></div></div></main>
<script>const hues=[158,188,222,258,286,42];let i=0;function changeColor(){i=(i+1)%hues.length;document.documentElement.style.setProperty('--h',hues[i])}setInterval(changeColor,18000)</script></body></html>

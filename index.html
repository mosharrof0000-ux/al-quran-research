<iframe id="researchApp" title="আল-কুরআন গবেষণা" src="chatbox-v28-live.html?v=20260911-research-id-v1"></iframe>
<script>
(function(){
  const frame=document.getElementById('researchApp');
  frame.addEventListener('load',function(){
    try{
      const doc=frame.contentDocument;
      if(!doc)return;
      if(!doc.getElementById('chatboxTimeoutFixScript')){
        const s=doc.createElement('script');
        s.id='chatboxTimeoutFixScript';
        s.src='chatbox-timeout-fix.js?v=20260911-90s';
        doc.head.appendChild(s);
      }
      if(!doc.getElementById('chatboxTtsCleanScript')){
        const s=doc.createElement('script');
        s.id='chatboxTtsCleanScript';
        s.src='chatbox-tts-clean.js?v=20260911-markdown-v1';
        doc.head.appendChild(s);
      }
    }catch(e){ console.warn('Chat Box enhancement could not load',e); }
  });
})();
</script>
<script src="chat-system.js?v=20260902-2"></script>
</body>

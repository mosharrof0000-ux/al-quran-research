<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>আল-কুরআন রিসার্চ — Project AI Demo</title><style>body{margin:0;font-family:system-ui,"Noto Sans Bengali",sans-serif;background:#f7faf8;color:#17352a}main{max-width:900px;margin:auto;padding:18px}header{background:#fff;padding:16px;border-bottom:1px solid #dbe8e1}h1{font-size:19px;margin:0}.panel,.msg{background:#fff;border:1px solid #dbe8e1;border-radius:14px;padding:12px;margin:10px 0}input,textarea,button{font:inherit;width:100%;box-sizing:border-box;padding:10px;border-radius:10px;border:1px solid #cbdad3}textarea{min-height:90px;margin-top:8px}button{background:#176b4a;color:#fff;font-weight:700;margin-top:8px}.user{background:#e6f3ec}.small{font-size:12px;color:#667a71}</style></head><body><header><h1>আল-কুরআন রিসার্চ — Project AI Demo</h1><div class="small">Isolated Project Agent</div></header><main><div class="panel"><div class="small">Project Agent Worker</div><input id="endpoint" value="https://agent-project-engine-v1-isolated-al-quran-research.mosharrof0000.workers.dev"><input id="token" type="password" placeholder="Access Token" style="margin-top:8px"></div><div id="chat"><div class="msg">AI Demo প্রস্তুত।</div></div><div class="panel"><textarea id="q" placeholder="আপনার প্রশ্ন লিখুন…"></textarea><button id="send">প্রশ্ন পাঠান</button><div id="status" class="small">প্রস্তুত</div></div></main><script>const $=x=>document.getElementById(x);function add(c,t){let d=document.createElement('div');d.className='msg '+c;d.textContent=t;$('chat').appendChild(d)}async function send(){let q=$('q').value.trim();if(!q)return;add('user',q);$('q').value='';$('send').disabled=true;$('status').textContent='AI কাজ করছে…';try{let r=await fetch($('endpoint').value.trim(),{method:'POST',headers:{'Content-Type':'application/json','x-agent-access-token':$('token').value.trim()},body:JSON.stringify({request:q})});let d=await r.json();if(!r.ok)throw Error(d.error||('HTTP '+r.status));let i=d.identity||{},x=d.result||{};add('',(x.answer||JSON.stringify(x,null,2))+'\n\nTask: '+(i.task_id||'—')+'\nAgent: '+(i.agent_name||'—')+' • '+(i.agent_id||'—')+'\nStatus: '+(d.status||'—'));$('status').textContent='উত্তর পাওয়া গেছে'}catch(e){add('', 'BLOCKED / ERROR\n'+e.message);$('status').textContent='সংযোগ/অনুমতি সমস্যা'}finally{$('send').disabled=false}}$('send').onclick=send</script></body></html>

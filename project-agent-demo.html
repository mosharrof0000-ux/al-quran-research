<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>আল-কুরআন রিসার্চ — Project AI</title><style>body{margin:0;font-family:system-ui,"Noto Sans Bengali",sans-serif;background:#f5f8f6;color:#17352a}header{padding:14px;background:#fff;border-bottom:1px solid #dbe8e1;font-weight:700}main{max-width:820px;margin:auto;padding:12px 12px 120px}.msg{max-width:88%;margin:10px 0;padding:11px 13px;border-radius:14px;white-space:pre-wrap;line-height:1.55;border:1px solid #dbe8e1;background:#fff}.user{margin-left:auto;background:#e8f3ed}.settings{font-size:12px;color:#61766d;margin-bottom:10px}.settings input{width:100%;box-sizing:border-box;padding:8px;border:1px solid #cbdad3;border-radius:9px;margin-top:4px}.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dbe8e1;padding:9px}.inner{max-width:820px;margin:auto;display:flex;gap:7px}.inner textarea{flex:1;min-height:48px;resize:none;padding:10px;border:1px solid #cbdad3;border-radius:12px;font:inherit}.inner button{width:86px;border:0;border-radius:12px;background:#176b4a;color:#fff;font-weight:700}.status{font-size:12px;color:#61766d;margin-top:4px}</style></head><body><header>আল-কুরআন রিসার্চ — Project AI</header><main><div class="settings">Project Agent endpoint<input id="endpoint" value="https://agent-project-engine-v1-isolated-al-quran-research.mosharrof0000.workers.dev"><input id="token" type="password" placeholder="Access Token"></div><div id="chat"><div class="msg">Project AI প্রস্তুত। প্রশ্ন লিখুন।</div></div></main><div class="bar"><div class="inner"><textarea id="q" placeholder="আপনার প্রশ্ন লিখুন…"></textarea><button id="send">পাঠান</button></div><div class="inner"><div id="status" class="status">প্রস্তুত</div></div></div><script>const $=id=>document.getElementById(id);function add(c,t){let d=document.createElement("div");d.className="msg "+c;d.textContent=t;$("chat").appendChild(d);d.scrollIntoView({behavior:"smooth"})}async function send(){let q=$("q").value.trim();if(!q)return;add("user",q);$("q").value="";$("send").disabled=true;$("status").textContent="AI কাজ করছে…";try{let r=await fetch($("endpoint").value.trim(),{method:"POST",headers:{"Content-Type":"application/json","x-agent-access-token":$("token").value.trim()},body:JSON.stringify({request:q})});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"HTTP "+r.status);let i=d.identity||{},x=d.result||{};add("",(x.answer||JSON.stringify(x,null,2))+"\n\nTask: "+(i.task_id||"—")+"\nAgent: "+(i.agent_name||"—")+"\nStatus: "+(d.status||"—"));$("status").textContent="উত্তর পাওয়া গেছে"}catch(e){add("","সংযোগ/অনুমতি সমস্যা: "+e.message);$("status").textContent="ব্যর্থ"}finally{$("send").disabled=false}}$("send").onclick=send;$("q").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});</script></body></html>

<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071d1d">
<title>AI গবেষণা সহকারী — আল-কুরআন গবেষণা</title>
<style>
:root{--bg:#071d1d;--deep:#082525;--green:#0d4b3e;--gold:#cda84a;--gold2:#f2d786;--cream:#f7f2e8;--ink:#25272a;--line:rgba(223,185,85,.7)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Noto Sans Bengali",system-ui,sans-serif;background:radial-gradient(circle at 50% 0,#123f3c 0,#071d1d 52%,#041314 100%);color:var(--cream)}
body{padding-bottom:104px}.app{max-width:760px;margin:auto;min-height:100vh;position:relative;overflow:hidden}.topbar{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;background:#0c3e39;border-bottom:1px solid #cda84a66;position:sticky;top:0;z-index:20}.back{font-size:31px;color:#ead67d;text-decoration:none}.title{text-align:center}.title b{display:block;font-size:22px}.title span{font-size:12px;color:#d8d0c4}.top-tools{display:flex;gap:7px}.top-tool{width:40px;height:40px;border:1px solid #cda84a66;border-radius:12px;background:#ffffff12;color:#fff;font-size:18px}.intro{margin:14px 15px 8px;background:linear-gradient(135deg,#f8f3e8,#eee0b6);color:#292822;border-radius:18px;padding:15px;box-shadow:0 8px 22px #0004}.intro b{font-size:18px}.intro p{margin:5px 0 0;font-size:12px;color:#5c5549;line-height:1.7}.modebar{display:flex;gap:7px;overflow:auto;padding:8px 15px 5px;background:#f0eee9;scrollbar-width:none}.modebar::-webkit-scrollbar{display:none}.mode{white-space:nowrap;border:1px solid #d2cbbc;background:#fff;border-radius:18px;padding:8px 11px;font:inherit;font-size:12px}.mode.active{background:#0d5548;color:#fff;border-color:#0d5548}.chat{background:#f0eee9;color:var(--ink);min-height:calc(100vh - 68px);display:flex;flex-direction:column}.chat-body{padding:15px;display:grid;gap:13px;flex:1;overflow:auto}.row{display:flex;gap:8px;align-items:flex-start}.bubble{max-width:86%;padding:13px 15px;border-radius:15px;box-shadow:0 2px 8px #0002;line-height:1.7;font-size:15px;white-space:pre-wrap}.ai{background:#fff;border:1px solid #dedbd3}.user{margin-left:auto;background:#0e5949;color:#fff;border-radius:15px 4px 15px 15px}.avatar{width:34px;height:34px;flex:none;border-radius:50%;background:#0c4b3c;color:#f2d786;display:grid;place-items:center;border:1px solid #cda84a;font-size:18px}.quick{margin:0 15px 12px;background:#fff;border:1px solid #ddd6c8;border-radius:15px;padding:12px}.quick b{font-size:13px}.quick-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.quick-actions button{border:1px solid #b7b8ae;background:#f2f2ed;border-radius:9px;padding:8px 10px;font:inherit;font-size:12px;cursor:pointer}.composer{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;width:min(720px,calc(100% - 28px));display:flex;gap:7px;background:#f6f3ed;border:1px solid #c9c4b8;border-radius:18px;padding:8px;z-index:30;box-shadow:0 8px 28px #0007}.composer input{border:0;outline:0;flex:1;background:#fff;border-radius:12px;padding:13px;font:inherit;min-width:0}.tool{width:45px;height:45px;border:1px solid #c9c4b8;background:#fff;border-radius:12px;font-size:19px}.tool.active{background:#e8e0c8}.send{border:0;background:#0d5548;color:#fff;border-radius:12px;padding:0 17px;font-size:20px}.status{text-align:center;color:#6a645c;font-size:11px;padding:6px 15px}.typing{opacity:.7}.home-link{color:#755f22;text-decoration:none;font-size:12px}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><a class="back" href="index.html" aria-label="ফিরে যান">‹</a><div class="title"><b>AI গবেষণা সহকারী</b><span>আল-কুরআন গবেষণা ল্যাব</span></div><div class="top-tools"><button class="top-tool" id="clear" title="চ্যাট পরিষ্কার">⌫</button></div></header>
<div class="chat">
<div class="intro"><b>আপনার গবেষণা সহকারী প্রস্তুত</b><p>বাংলায় প্রশ্ন লিখুন। শব্দ, আয়াত, অনুবাদ, একই শব্দ অনুসন্ধান ও গাণিতিক গবেষণার জন্য আলাদা মোড বেছে নিতে পারবেন।</p></div>
<div class="modebar" id="modebar"></div>
<div class="chat-body" id="chatBody"></div>
<div class="quick"><b>দ্রুত শুরু করুন</b><div class="quick-actions"><button data-q="সূরা ফাতিহা সম্পর্কে গবেষণা শুরু করি">সূরা ফাতিহা</button><button data-q="একটি শব্দ গবেষণা করতে চাই">শব্দ গবেষণা</button><button data-q="একটি আয়াত বিশ্লেষণ করতে চাই">আয়াত বিশ্লেষণ</button><button data-q="একই শব্দ কোথায় কোথায় আছে জানতে চাই">একই শব্দ</button></div></div>
<div class="status" id="status">বাংলা AI চ্যাট প্রস্তুত</div>
</div>
<div class="composer"><button class="tool" id="mic" title="বাংলায় কথা বলুন">🎤</button><button class="tool active" id="speaker" title="উত্তর শুনুন">🔊</button><input id="input" placeholder="বাংলায় লিখুন বা 🎤 চাপুন..." autocomplete="off"><button class="send" id="send">➤</button></div>
</div>
<script>
(function(){'use strict';
const API='https://al-quran-research.mosharrof0000-ux.workers.dev/';
const modes=[['general','💬 সাধারণ প্রশ্ন'],['word','🔎 শব্দ গবেষণা'],['ayah','🧩 আয়াত বিশ্লেষণ'],['math','📊 গাণিতিক গবেষণা'],['concordance','🔗 একই শব্দ অনুসন্ধান'],['translation','📝 অনুবাদ গবেষণা']];
let mode='general',speaker=true,sending=false,recognition=null,listening=false;
const body=document.getElementById('chatBody'),input=document.getElementById('input'),status=document.getElementById('status');
function addAI(text,speakIt){const row=document.createElement('div');row.className='row';const av=document.createElement('div');av.className='avatar';av.textContent='AI';const b=document.createElement('div');b.className='bubble ai';b.textContent=text;row.append(av,b);body.appendChild(row);body.scrollTop=body.scrollHeight;if(speakIt!==false&&speaker)say(text)}
function addUser(text){const b=document.createElement('div');b.className='bubble user';b.textContent=text;body.appendChild(b);body.scrollTop=body.scrollHeight}
function say(text){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='bn-BD';u.rate=.92;u.pitch=1;speechSynthesis.speak(u)}
function localAnswer(q){if(mode==='math')return 'গাণিতিক গবেষণা মোড চালু আছে। ডেটাবেসের তথ্য ছাড়া কোনো সংখ্যা অনুমান করা হবে না।';if(mode==='word')return 'শব্দ গবেষণা মোড চালু আছে। শব্দ দিলে মূল/ধাতু, শব্দরূপ, ব্যাকরণ ও অর্থপরিসর গবেষণার কাঠামো ব্যবহার করা হবে।';if(mode==='ayah')return 'আয়াত বিশ্লেষণ মোড চালু আছে। সূরা ও আয়াত নম্বর দিলে ভাষা, শব্দ, ব্যাকরণ ও গবেষণা-তথ্য আলাদা করে দেখা হবে।';if(mode==='concordance')return 'একই শব্দ অনুসন্ধান মোড চালু আছে। শব্দ দিলে তার বিভিন্ন অবস্থান একত্র করার কাঠামো ব্যবহার করা হবে।';if(mode==='translation')return 'অনুবাদ গবেষণা মোড চালু আছে। মূল শব্দ, প্রসঙ্গ ও বাংলা রূপ আলাদা করে দেখা হবে।';return 'আল-কুরআন গবেষণা সহকারী প্রস্তুত। আপনার প্রশ্নটি বাংলায় লিখুন।'}
async function sendMessage(textOverride){if(sending)return;const text=(textOverride||input.value).trim();if(!text)return;sending=true;input.value='';addUser(text);status.textContent='উত্তর তৈরি হচ্ছে…';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({message:text,mode:mode,language:'bn'})});const raw=await r.text();let data={};try{data=JSON.parse(raw)}catch(e){}if(!r.ok||!data.answer)throw new Error(data.detail||data.error||('Worker HTTP '+r.status));addAI(data.answer,true);status.textContent='বাংলা AI চ্যাট প্রস্তুত'}catch(e){console.error(e);addAI('AI সংযোগে সমস্যা হয়েছে। স্থানীয় গবেষণা সহকারী উত্তর দিচ্ছে।\n\n'+localAnswer(text),false);status.textContent='স্থানীয় সহকারী সক্রিয়'}finally{sending=false}}
function buildModes(){const bar=document.getElementById('modebar');modes.forEach(([id,label])=>{const b=document.createElement('button');b.className='mode'+(id===mode?' active':'');b.textContent=label;b.onclick=()=>{mode=id;bar.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));b.classList.add('active');addAI('মোড পরিবর্তন হয়েছে। এখন আপনার প্রশ্ন করুন।',false)};bar.appendChild(b)})}
function voice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){addAI('আপনার ব্রাউজারে বাংলা ভয়েস ইনপুট সুবিধা নেই। Chrome-এ চেষ্টা করুন।',false);return}if(listening){recognition.stop();return}recognition=new SR();recognition.lang='bn-BD';recognition.interimResults=false;recognition.maxAlternatives=1;listening=true;document.getElementById('mic').textContent='⏹️';status.textContent='🎙️ শুনছি… বাংলায় বলুন';recognition.onresult=e=>{input.value=e.results[0][0].transcript;sendMessage()};recognition.onerror=()=>addAI('ভয়েস শুনতে সমস্যা হয়েছে। আবার 🎤 চাপুন।',false);recognition.onend=()=>{listening=false;document.getElementById('mic').textContent='🎤';status.textContent='বাংলা AI চ্যাট প্রস্তুত'};recognition.start()}
document.getElementById('send').onclick=()=>sendMessage();input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();sendMessage()}};document.getElementById('mic').onclick=voice;document.getElementById('speaker').onclick=()=>{speaker=!speaker;const b=document.getElementById('speaker');b.classList.toggle('active',speaker);b.textContent=speaker?'🔊':'🔇'};document.getElementById('clear').onclick=()=>{body.innerHTML='';addAI('নতুন চ্যাট শুরু হয়েছে। কী নিয়ে গবেষণা করবেন?',false)};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>sendMessage(b.dataset.q));buildModes();addAI('আসসালামু আলাইকুম। আমি আপনার গবেষণা সহকারী। বাংলায় প্রশ্ন করুন—আমরা ধাপে ধাপে গবেষণা করব।',false);
})();
</script>
</body>
</html>

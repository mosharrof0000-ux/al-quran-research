<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102a2a">
<meta name="description" content="মোশাররফ — স্মার্ট AI সহকারী ও টুলস প্ল্যাটফর্ম">
<title>মোশাররফ — Smart AI Assistant</title>
<style>
:root{--bg:#071c1c;--bg2:#123d39;--glass:rgba(255,255,255,.075);--glass2:rgba(255,255,255,.12);--text:#f7f3e8;--muted:#c9c7bd;--gold:#d8b75a;--green:#0d5548;--user:#145c4d;--line:rgba(216,183,90,.42);--panel:rgba(8,31,30,.94);--speed:22s}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Noto Sans Bengali",system-ui,sans-serif;color:var(--text);background:#061818}body{min-height:100dvh}body:before{content:"";position:fixed;inset:-30%;z-index:-2;background:radial-gradient(circle at 12% 18%,rgba(39,148,126,.34),transparent 31%),radial-gradient(circle at 88% 76%,rgba(205,168,74,.17),transparent 29%),linear-gradient(135deg,var(--bg),var(--bg2));animation:flow var(--speed) ease-in-out infinite alternate}
@keyframes flow{0%{transform:scale(1) rotate(0);filter:hue-rotate(0deg)}50%{transform:scale(1.07) rotate(1.5deg);filter:hue-rotate(14deg)}100%{transform:scale(1.03) rotate(-1deg);filter:hue-rotate(28deg)}}
.app{width:100%;height:100dvh;padding:7px;display:flex}.frame{width:100%;height:100%;min-width:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:rgba(4,22,22,.28);backdrop-filter:blur(18px);box-shadow:0 18px 60px rgba(0,0,0,.28)}
.topbar{height:62px;flex:none;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:0 8px;border-bottom:1px solid rgba(216,183,90,.24);background:rgba(4,25,24,.42);backdrop-filter:blur(18px);z-index:20}.icon-btn{width:42px;height:42px;border:1px solid rgba(255,255,255,.16);border-radius:13px;background:var(--glass);color:#fff;font-size:21px;cursor:pointer}.title{text-align:center;min-width:0}.title b{display:block;font-size:19px;line-height:1.25}.title span{font-size:10px;color:var(--muted)}
.chat{flex:1;min-height:0;display:flex;flex-direction:column}.chat-body{flex:1;min-height:0;overflow:auto;padding:22px clamp(12px,4vw,46px) 18px;display:grid;align-content:start;gap:16px;scroll-behavior:smooth}.row{display:flex;gap:9px;align-items:flex-start}.avatar{width:30px;height:30px;flex:none;border-radius:10px;background:rgba(13,85,72,.82);border:1px solid rgba(216,183,90,.6);color:#f2d786;display:grid;place-items:center;font-size:10px}.bubble{max-width:min(860px,88%);padding:12px 15px;border-radius:17px;line-height:1.8;font-size:15px;white-space:pre-wrap;box-shadow:0 3px 15px rgba(0,0,0,.11);transition:.35s}.ai{background:rgba(255,255,255,.92);color:#202424;border:1px solid rgba(255,255,255,.52);border-radius:17px 17px 17px 5px}.user{margin-left:auto;background:rgba(20,92,77,.94);color:#fff;border:1px solid rgba(255,255,255,.08);border-radius:17px 5px 17px 17px}.ai.reading{transform:translateY(-1px);box-shadow:0 7px 24px rgba(0,0,0,.2)}
.welcome{text-align:center;padding:18px 12px 8px;color:#e8e2d5}.welcome-mark{width:52px;height:52px;margin:0 auto 9px;border:1px solid var(--gold);border-radius:16px;display:grid;place-items:center;background:rgba(216,183,90,.08);font-size:25px}.welcome b{font-size:18px}.welcome p{margin:5px auto 0;max-width:520px;color:var(--muted);font-size:12px;line-height:1.7}.quick{padding:0 clamp(12px,4vw,46px) 9px}.quick-actions{display:flex;gap:7px;overflow:auto;scrollbar-width:none}.quick-actions::-webkit-scrollbar{display:none}.quick button{white-space:nowrap;border:1px solid rgba(255,255,255,.16);background:var(--glass);color:#f5f1e8;border-radius:16px;padding:8px 11px;font:inherit;font-size:12px;cursor:pointer}.status{text-align:center;color:rgba(255,255,255,.62);font-size:10px;padding:1px 10px 7px}
.composer{flex:none;display:flex;align-items:center;gap:7px;margin:0 clamp(8px,2vw,18px) calc(8px + env(safe-area-inset-bottom));padding:7px;border:1px solid rgba(216,183,90,.34);border-radius:20px;background:rgba(248,245,238,.94);box-shadow:0 8px 30px rgba(0,0,0,.2)}.composer input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#202424;padding:11px 8px;font:inherit;font-size:15px}.composer input::placeholder{color:#77746d}.tool{width:40px;height:40px;flex:none;border:1px solid #cbc5b8;background:#fff;color:#252725;border-radius:13px;font-size:17px;cursor:pointer}.tool.active{background:#e8e0c8}.send{width:42px;height:42px;flex:none;border:0;border-radius:14px;background:var(--green);color:#fff;font-size:19px;cursor:pointer}.send:active,.tool:active,.icon-btn:active{transform:scale(.96)}
.drawer{position:fixed;inset:0;z-index:50;pointer-events:none}.drawer.open{pointer-events:auto}.shade{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;transition:.25s}.drawer.open .shade{opacity:1}.panel{position:absolute;top:0;bottom:0;width:min(330px,86vw);background:var(--panel);backdrop-filter:blur(24px);box-shadow:0 0 45px rgba(0,0,0,.4);padding:18px;transition:transform .28s ease}.left .panel{left:0;transform:translateX(-105%);border-right:1px solid var(--line)}.right .panel{right:0;transform:translateX(105%);border-left:1px solid var(--line)}.drawer.open .panel{transform:translateX(0)}.panel-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid rgba(216,183,90,.25)}.panel-head b{font-size:19px}.close{width:38px;height:38px;border:1px solid rgba(255,255,255,.15);border-radius:12px;background:var(--glass);color:#fff;font-size:20px}.panel-list{display:grid;gap:8px;margin-top:16px}.panel-item{width:100%;text-align:left;border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.055);color:#f4f0e7;border-radius:14px;padding:13px;font:inherit;cursor:pointer}.panel-item small{display:block;color:#aaa99f;font-size:10px;margin-top:3px}.panel-note{margin-top:18px;padding:12px;border:1px solid rgba(216,183,90,.22);border-radius:14px;color:#c9c7bd;font-size:11px;line-height:1.7}
@media(min-width:900px){.app{padding:10px}.frame{border-radius:26px}.chat-body{padding-left:max(24px,calc((100vw - 1080px)/2));padding-right:max(24px,calc((100vw - 1080px)/2))}.quick{padding-left:max(24px,calc((100vw - 1080px)/2));padding-right:max(24px,calc((100vw - 1080px)/2))}.bubble{font-size:15.5px}}
@media(max-width:520px){.app{padding:4px}.frame{border-radius:17px}.topbar{height:58px}.title b{font-size:17px}.title span{display:none}.bubble{max-width:92%;font-size:14px}.welcome{padding-top:13px}}
.keyboard-open .welcome{transform:translateY(-34px);transition:transform .24s ease}.keyboard-open .chat-body{scroll-padding-top:34px}.keyboard-open .composer{margin-bottom:4px}@media(max-width:520px){.welcome{transition:transform .24s ease}.composer{padding-bottom:calc(7px + env(safe-area-inset-bottom))}}@media(prefers-reduced-motion:reduce){body:before{animation:none!important}.bubble,.welcome{transition:none}}
</style>
</head>
<body>
<div class="app"><div class="frame">
<header class="topbar"><button class="icon-btn" id="menuBtn" aria-label="মেনু">☰</button><div class="title"><b>মোশাররফ</b><span>স্মার্ট AI সহকারী</span></div><button class="icon-btn" id="moreBtn" aria-label="বিকল্প">⋮</button></header>
<main class="chat"><div class="chat-body" id="chatBody" aria-live="polite"><div class="welcome"><div class="welcome-mark">✦</div><b>মোশাররফ আপনাকে স্বাগত জানাচ্ছে</b><p>আপনার কাজ বলুন। কথোপকথনের ধারাটি মনে রেখে ধাপে ধাপে সহায়তা করব।</p></div></div><div class="quick"><div class="quick-actions"><button data-q="আজকের কাজ শুরু করি">কাজ শুরু</button><button data-q="আমার জন্য একটি নতুন টুলের ধারণা তৈরি করো">নতুন টুল</button><button data-q="আমার আগের কাজের ধারাটি দেখাও">আগের কাজ</button><button data-q="আমার জন্য একটি পরিকল্পনা তৈরি করো">পরিকল্পনা</button></div></div><div class="status" id="status">বাংলা AI চ্যাট প্রস্তুত</div></main>
<div class="composer"><button class="tool" id="mic" aria-label="বাংলায় কথা বলুন">🎤</button><button class="tool active" id="speaker" aria-label="উত্তর শুনুন">🔊</button><input id="input" placeholder="আপনার প্রশ্ন লিখুন..." autocomplete="off" aria-label="আপনার প্রশ্ন"><button class="send" id="send" aria-label="পাঠান">➤</button></div>
</div></div>
<div class="drawer left" id="leftDrawer"><div class="shade"></div><aside class="panel"><div class="panel-head"><b>মোশাররফ</b><button class="close">×</button></div><div class="panel-list"><button class="panel-item" data-go="chat.html">✦ মোশাররফ চ্যাট<small>স্মার্ট AI সহকারী</small></button><button class="panel-item" data-q="টুলস খুলে দাও">🧩 টুলস<small>আপনার কাজের জন্য টুলস</small></button><button class="panel-item" data-q="টুলস গ্যালারি খুলে দাও">▦ টুলস গ্যালারি<small>যাচাই করা টুলস</small></button><button class="panel-item" data-q="আমার জন্য একটি নতুন টুল বানানোর কাজ শুরু করো">⚙ টুলস ইঞ্জিনিয়ার<small>নতুন টুল তৈরির কাজ</small></button></div><div class="panel-note">মোশাররফের কথোপকথনের নোট এই ব্রাউজারে রাখা হয়। নতুন টুল আগে তৈরি ও যাচাই করা হবে, তারপর টুলস গ্যালারিতে যোগ করা যাবে।</div></aside></div>
<div class="drawer right" id="rightDrawer"><div class="shade"></div><aside class="panel"><div class="panel-head"><b>বিকল্প</b><button class="close">×</button></div><div class="panel-list"><button class="panel-item" id="clear">⌫ চ্যাট পরিষ্কার<small>নতুন কথোপকথন শুরু করুন</small></button><button class="panel-item" id="modeBtn">◌ গবেষণা মোড<small>ভবিষ্যৎ ধাপে নির্দিষ্ট মোড যোগ হবে</small></button><button class="panel-item" id="stopBtn">🔇 কথা বলা বন্ধ<small>চলমান কণ্ঠ বন্ধ করুন</small></button></div></aside></div>
<script>
(function(){'use strict';
const API='https://al-quran-research.mosharrof0000.workers.dev/';let speaker=true,sending=false,recognition=null,listening=false;
const body=document.getElementById('chatBody'),input=document.getElementById('input'),status=document.getElementById('status');
const MOSHARRIF_MEMORY_KEY='mosharrof-chat-memory-v1';
function loadMosharrifMemory(){const d={version:1,opens:0,lastOpen:null,messages:[],lastQuestion:''};try{const x=JSON.parse(localStorage.getItem(MOSHARRIF_MEMORY_KEY)||'{}');Object.assign(d,x);}catch(_){}d.opens=(d.opens||0)+1;d.lastOpen=new Date().toISOString();try{localStorage.setItem(MOSHARRIF_MEMORY_KEY,JSON.stringify(d));}catch(_){}return d}
const mosharrifMemory=loadMosharrifMemory();
function saveMosharrifMemory(){try{localStorage.setItem(MOSHARRIF_MEMORY_KEY,JSON.stringify(mosharrifMemory));}catch(_){mosharrifMemory.messages=mosharrifMemory.messages.slice(-40);try{localStorage.setItem(MOSHARRIF_MEMORY_KEY,JSON.stringify(mosharrifMemory));}catch(__){}}}
function noteMosharrif(role,text){mosharrifMemory.messages.push({role,text:String(text).slice(0,5000),at:new Date().toISOString()});mosharrifMemory.messages=mosharrifMemory.messages.slice(-120);if(role==='user')mosharrifMemory.lastQuestion=String(text).slice(0,500);saveMosharrifMemory()}
function mosharrifGreeting(){const h=new Date().getHours();const time=h<5?'এই গভীর রাতে':h<12?'এই সকালে':h<17?'এই দুপুরে':h<20?'এই সন্ধ্যায়':'এই রাতে';const last=mosharrifMemory.lastQuestion;const first=mosharrifMemory.opens===1;const list=first?['আসসালামু আলাইকুম। আমি মোশাররফ। '+time+' আপনাকে স্বাগতম। আজ যা নিয়ে কাজ করতে চান, বলুন।','স্বাগতম। আমি মোশাররফ—আপনার কাজের কথা ধরে রেখে ধারাবাহিকভাবে এগোতে প্রস্তুত। আজ কোথা থেকে শুরু করব?','আপনাকে স্বাগতম। মোশাররফ এখন প্রস্তুত—আপনার প্রয়োজনের কথাটিই আগে বলুন।']:['আবার স্বাগতম। আগের কথোপকথনের নোট আছে। আজ আগের কাজ এগিয়ে নেব, নাকি নতুন কিছু শুরু করব?','আবার দেখা হলো। আপনার সাম্প্রতিক কাজের ধারাটি মনে আছে'+(last?'—শেষ বিষয়টি ছিল: '+last:'')+'। এবার কী করতে হবে?','স্বাগতম। আজকের নতুন কাজটি বলুন—মোশাররফ সেখান থেকেই ধারাটি তৈরি করবে।','আপনি আবার এসেছেন। আগের নোটের সঙ্গে মিলিয়ে নতুন কাজ শুরু করতে প্রস্তুত আছি।'];let i=(mosharrifMemory.opens*7)%list.length;if(i===mosharrifMemory.greetingIndex)i=(i+1)%list.length;mosharrifMemory.greetingIndex=i;saveMosharrifMemory();return list[i]}
function addAI(text,speakIt){noteMosharrif('assistant',text);const row=document.createElement('div');row.className='row';const av=document.createElement('div');av.className='avatar';av.textContent='AI';const b=document.createElement('div');b.className='bubble ai';b.textContent=text;row.append(av,b);body.appendChild(row);body.scrollTop=body.scrollHeight;if(speakIt&&speaker)say(text,b)}
function addUser(text){noteMosharrif('user',text);const b=document.createElement('div');b.className='bubble user';b.textContent=text;body.appendChild(b);body.scrollTop=body.scrollHeight}
function setReading(on,b){if(b)b.classList.toggle('reading',on)}
function say(text,b){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();setReading(true,b);const u=new SpeechSynthesisUtterance(text);u.lang='bn-BD';u.rate=.92;u.pitch=1;u.onend=()=>setReading(false,b);u.onerror=()=>setReading(false,b);speechSynthesis.speak(u)}
function localAnswer(){return 'AI সংযোগ পাওয়া যায়নি। স্থানীয় গবেষণা সহকারী সক্রিয় আছে। আপনার প্রশ্নের নোট রাখা হয়েছে; পরে আবার চেষ্টা করুন।'}
async function sendMessage(textOverride){if(sending)return;const text=(textOverride||input.value).trim();if(!text)return;sending=true;input.value='';addUser(text);status.textContent='উত্তর তৈরি হচ্ছে…';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,mode:'general',language:'bn'})});const raw=await r.text();let data={};try{data=JSON.parse(raw)}catch(e){}if(!r.ok||!data.answer)throw new Error(data.detail||data.error||('Worker HTTP '+r.status));addAI(data.answer,true);status.textContent='বাংলা AI চ্যাট প্রস্তুত'}catch(e){console.error(e);addAI(localAnswer(),false);status.textContent='স্থানীয় সহকারী সক্রিয়'}finally{sending=false}}
function voice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){addAI('আপনার ব্রাউজারে বাংলা ভয়েস ইনপুট সুবিধা নেই। Chrome-এ চেষ্টা করুন।',false);return}if(listening){recognition.stop();return}recognition=new SR();recognition.lang='bn-BD';recognition.interimResults=false;recognition.maxAlternatives=1;listening=true;document.getElementById('mic').textContent='⏹️';status.textContent='🎙️ শুনছি… বাংলায় বলুন';recognition.onresult=e=>{input.value=e.results[0][0].transcript;sendMessage()};recognition.onerror=()=>{addAI('ভয়েস শুনতে সমস্যা হয়েছে। আবার 🎤 চাপুন।',false);status.textContent='বাংলা AI চ্যাট প্রস্তুত'};recognition.onend=()=>{listening=false;document.getElementById('mic').textContent='🎤';if(!sending)status.textContent='বাংলা AI চ্যাট প্রস্তুত'};recognition.start()}
function closeDrawers(){document.querySelectorAll('.drawer').forEach(d=>d.classList.remove('open'))}function openDrawer(id){closeDrawers();document.getElementById(id).classList.add('open')}
function syncKeyboardState(){if(!window.visualViewport)return;const delta=Math.max(0,window.innerHeight-window.visualViewport.height-window.visualViewport.offsetTop);document.body.classList.toggle('keyboard-open',delta>120)}function init(){document.querySelector('.title b').textContent='মোশাররফ';document.querySelector('.title span').textContent='স্মার্ট AI সহকারী';const welcome=document.querySelector('.welcome');welcome.querySelector('b').textContent='মোশাররফ স্বাগত জানাচ্ছে';welcome.querySelector('p').textContent=mosharrifGreeting()+' প্রশ্ন, কাজের নির্দেশ ও প্রয়োজনীয় চ্যাট-নোট এই ব্রাউজারেই ধারাবাহিকভাবে রাখা হবে।';document.getElementById('send').onclick=()=>sendMessage();input.addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage()});document.getElementById('mic').onclick=voice;document.getElementById('speaker').onclick=()=>{speaker=!speaker;document.getElementById('speaker').classList.toggle('active',speaker);if(!speaker)speechSynthesis.cancel()};document.getElementById('clear').onclick=()=>{speechSynthesis.cancel();body.innerHTML='';const w=document.createElement('div');w.className='welcome';w.innerHTML='<div class="welcome-mark">◈</div><b>নতুন কথোপকথন</b><p>আপনার পরবর্তী গবেষণার প্রশ্ন লিখুন।</p>';body.appendChild(w);status.textContent='বাংলা AI চ্যাট প্রস্তুত';closeDrawers()};document.getElementById('stopBtn').onclick=()=>{speechSynthesis.cancel();document.querySelectorAll('.bubble.reading').forEach(x=>x.classList.remove('reading'));closeDrawers()};document.getElementById('menuBtn').onclick=()=>openDrawer('leftDrawer');document.getElementById('moreBtn').onclick=()=>openDrawer('rightDrawer');document.querySelectorAll('.shade,.close').forEach(x=>x.onclick=closeDrawers);document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>sendMessage(b.dataset.q));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>location.href=b.dataset.go);document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{closeDrawers();sendMessage(b.dataset.q)});if(window.visualViewport){visualViewport.addEventListener('resize',syncKeyboardState);visualViewport.addEventListener('scroll',syncKeyboardState)}input.addEventListener('focus',()=>setTimeout(syncKeyboardState,180));input.addEventListener('blur',()=>setTimeout(syncKeyboardState,180));syncKeyboardState()}

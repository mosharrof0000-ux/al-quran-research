<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102a2a">
<meta name="description" content="আল-কুরআন গবেষণা AI সহকারী">
<title>AI গবেষণা সহকারী — আল-কুরআন গবেষণা</title>
<style>
:root{--bg1:#102f2d;--bg2:#071a1a;--panel:rgba(255,255,255,.94);--panelText:#1d2424;--text:#f7f3e8;--muted:#d8d4ca;--accent:#d8b75a;--accent2:#0d5548;--user:#0e5949;--border:rgba(216,183,90,.5);--shadow:0 12px 34px rgba(0,0,0,.25);--speed:18s}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Noto Sans Bengali",system-ui,sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--text)}
body{min-height:100dvh}
body::before{content:"";position:fixed;inset:-25%;z-index:-2;background:radial-gradient(circle at 15% 20%,rgba(55,170,145,.32),transparent 32%),radial-gradient(circle at 85% 75%,rgba(205,168,74,.2),transparent 30%),linear-gradient(135deg,var(--bg1),var(--bg2));animation:bgFlow var(--speed) ease-in-out infinite alternate}
body.reading::before{animation-duration:24s}
@keyframes bgFlow{0%{transform:scale(1) rotate(0deg);filter:hue-rotate(0deg)}50%{transform:scale(1.08) rotate(2deg);filter:hue-rotate(18deg)}100%{transform:scale(1.02) rotate(-2deg);filter:hue-rotate(35deg)}}
.app{width:100%;height:100dvh;display:flex;flex-direction:column;position:relative}
.topbar{height:66px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 max(14px,env(safe-area-inset-left)) 0 max(14px,env(safe-area-inset-right));background:rgba(6,29,29,.72);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);z-index:20}
.back{font-size:32px;color:#f1d984;text-decoration:none;width:44px;text-align:left}
.title{text-align:center;min-width:0}.title b{display:block;font-size:20px;line-height:1.25}.title span{font-size:11px;color:var(--muted)}
.top-tools{display:flex;gap:7px}.top-tool{width:40px;height:40px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.09);color:#fff;font-size:18px}
.chat{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;transition:color 2s ease}
.intro{margin:10px 14px 6px;padding:13px 15px;border-radius:17px;background:rgba(248,243,232,.94);color:#242725;box-shadow:var(--shadow);flex:none}.intro b{font-size:17px}.intro p{margin:4px 0 0;font-size:12px;line-height:1.65;color:#57534b}
.modebar{display:flex;gap:7px;overflow:auto;padding:7px 14px 8px;scrollbar-width:none;flex:none}.modebar::-webkit-scrollbar{display:none}.mode{white-space:nowrap;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);color:var(--text);border-radius:18px;padding:8px 11px;font:inherit;font-size:12px;backdrop-filter:blur(10px)}.mode.active{background:rgba(13,85,72,.9);border-color:#e0c36c;color:#fff}
.chat-body{flex:1;min-height:0;overflow:auto;padding:8px 14px 10px;display:grid;align-content:start;gap:12px;scroll-behavior:smooth}
.row{display:flex;gap:8px;align-items:flex-start}.bubble{max-width:min(88%,760px);padding:13px 15px;border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.14);line-height:1.75;font-size:15px;white-space:pre-wrap;transition:background 2s ease,color 2s ease,border-color 2s ease,transform .3s ease}.ai{background:rgba(255,255,255,.94);color:#202424;border:1px solid rgba(255,255,255,.65)}.ai.reading{transform:translateY(-1px);box-shadow:0 8px 22px rgba(0,0,0,.22)}.user{margin-left:auto;background:rgba(14,89,73,.94);color:#fff;border-radius:16px 5px 16px 16px}.avatar{width:34px;height:34px;flex:none;border-radius:50%;background:rgba(12,75,60,.9);color:#f2d786;display:grid;place-items:center;border:1px solid #cda84a;font-size:13px}
.quick{margin:0 14px 8px;background:rgba(255,255,255,.9);color:#242725;border:1px solid rgba(255,255,255,.5);border-radius:15px;padding:11px;flex:none}.quick b{font-size:13px}.quick-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.quick-actions button{border:1px solid #c6c6bd;background:#f2f2ed;color:#252725;border-radius:9px;padding:8px 10px;font:inherit;font-size:12px;cursor:pointer}
.status{text-align:center;color:rgba(255,255,255,.82);font-size:11px;padding:4px 15px 7px;flex:none}
.composer{flex:none;width:100%;display:flex;gap:7px;background:rgba(246,243,237,.96);border-top:1px solid rgba(210,196,161,.7);padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));z-index:30;box-shadow:0 -8px 28px rgba(0,0,0,.22)}
.composer input{border:1px solid #d3cec3;outline:0;flex:1;background:#fff;color:#202424;border-radius:12px;padding:12px 13px;font:inherit;min-width:0;font-size:15px}.composer input:focus{border-color:#8f7a3e;box-shadow:0 0 0 3px rgba(205,168,74,.15)}
.tool{width:45px;height:45px;flex:none;border:1px solid #c9c4b8;background:#fff;color:#242725;border-radius:12px;font-size:19px}.tool.active{background:#e8e0c8}.send{border:0;background:#0d5548;color:#fff;border-radius:12px;padding:0 17px;font-size:20px;min-width:52px}
.reading-indicator{position:absolute;right:14px;top:76px;padding:5px 9px;border-radius:14px;background:rgba(0,0,0,.28);color:#fff;font-size:10px;opacity:0;pointer-events:none;transition:opacity .5s}.reading .reading-indicator{opacity:1}
@media(max-width:600px){.intro{margin-top:7px}.intro p{font-size:11px}.bubble{max-width:92%;font-size:14px}.title b{font-size:18px}}
@media(min-width:900px){.chat-body,.intro,.modebar,.quick,.status{padding-left:max(14px,calc((100vw - 1100px)/2));padding-right:max(14px,calc((100vw - 1100px)/2))}.intro{margin-left:0;margin-right:0;border-radius:0}.modebar{padding-top:8px}}
@media(prefers-reduced-motion:reduce){body::before{animation:none!important}.bubble{transition:none}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
<a class="back" href="index.html" aria-label="ফিরে যান">‹</a>
<div class="title"><b>AI গবেষণা সহকারী</b><span>আল-কুরআন গবেষণা ল্যাব</span></div>
<div class="top-tools"><button class="top-tool" id="clear" title="চ্যাট পরিষ্কার" aria-label="চ্যাট পরিষ্কার">⌫</button></div>
</header>
<div class="chat" id="chat">
<div class="intro"><b>আপনার গবেষণা সহকারী প্রস্তুত</b><p>বাংলায় প্রশ্ন লিখুন। শব্দ, আয়াত, অনুবাদ, একই শব্দ অনুসন্ধান ও গাণিতিক গবেষণার জন্য আলাদা মোড বেছে নিতে পারবেন।</p></div>
<div class="modebar" id="modebar"></div>
<div class="chat-body" id="chatBody" aria-live="polite"></div>
<div class="quick"><b>দ্রুত শুরু করুন</b><div class="quick-actions"><button data-q="সূরা ফাতিহা সম্পর্কে গবেষণা শুরু করি">সূরা ফাতিহা</button><button data-q="একটি শব্দ গবেষণা করতে চাই">শব্দ গবেষণা</button><button data-q="একটি আয়াত বিশ্লেষণ করতে চাই">আয়াত বিশ্লেষণ</button><button data-q="একই শব্দ কোথায় কোথায় আছে জানতে চাই">একই শব্দ</button></div></div>
<div class="status" id="status">বাংলা AI চ্যাট প্রস্তুত</div>
<div class="reading-indicator">🔊 পড়া চলছে</div>
</div>
<div class="composer">
<button class="tool" id="mic" title="বাংলায় কথা বলুন" aria-label="বাংলায় কথা বলুন">🎤</button>
<button class="tool active" id="speaker" title="উত্তর শুনুন" aria-label="উত্তর শুনুন">🔊</button>
<input id="input" placeholder="বাংলায় লিখুন বা 🎤 চাপুন..." autocomplete="off" aria-label="আপনার প্রশ্ন">
<button class="send" id="send" aria-label="পাঠান">➤</button>
</div>
</div>
<script>
(function(){'use strict';
const API='https://al-quran-research.mosharrof0000.workers.dev/';
const modes=[['general','💬 সাধারণ প্রশ্ন'],['word','🔎 শব্দ গবেষণা'],['ayah','🧩 আয়াত বিশ্লেষণ'],['math','📊 গাণিতিক গবেষণা'],['concordance','🔗 একই শব্দ অনুসন্ধান'],['translation','📝 অনুবাদ গবেষণা']];
let mode='general',speaker=true,sending=false,recognition=null,listening=false;
const body=document.getElementById('chatBody'),input=document.getElementById('input'),status=document.getElementById('status'),chat=document.getElementById('chat');
function addAI(text,speakIt){const row=document.createElement('div');row.className='row';const av=document.createElement('div');av.className='avatar';av.textContent='AI';const b=document.createElement('div');b.className='bubble ai';b.textContent=text;row.append(av,b);body.appendChild(row);body.scrollTop=body.scrollHeight;if(speakIt!==false&&speaker)say(text,b)}
function addUser(text){const b=document.createElement('div');b.className='bubble user';b.textContent=text;body.appendChild(b);body.scrollTop=body.scrollHeight}
function setReading(on,bubble){document.body.classList.toggle('reading',on);if(bubble)bubble.classList.toggle('reading',on)}
function say(text,bubble){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();setReading(true,bubble);const u=new SpeechSynthesisUtterance(text);u.lang='bn-BD';u.rate=.92;u.pitch=1;u.onend=()=>setReading(false,bubble);u.onerror=()=>setReading(false,bubble);speechSynthesis.speak(u)}
function localAnswer(){if(mode==='math')return 'গাণিতিক গবেষণা মোড চালু আছে। ডেটাবেসের তথ্য ছাড়া কোনো সংখ্যা অনুমান করা হবে না।';if(mode==='word')return 'শব্দ গবেষণা মোড চালু আছে। শব্দ দিলে মূল/ধাতু, শব্দরূপ, ব্যাকরণ ও অর্থপরিসর গবেষণার কাঠামো ব্যবহার করা হবে।';if(mode==='ayah')return 'আয়াত বিশ্লেষণ মোড চালু আছে। সূরা ও আয়াত নম্বর দিলে ভাষা, শব্দ, ব্যাকরণ ও গবেষণা-তথ্য আলাদা করে দেখা হবে।';if(mode==='concordance')return 'একই শব্দ অনুসন্ধান মোড চালু আছে। শব্দ দিলে তার বিভিন্ন অবস্থান একত্র করার কাঠামো ব্যবহার করা হবে।';if(mode==='translation')return 'অনুবাদ গবেষণা মোড চালু আছে। মূল শব্দ, প্রসঙ্গ ও বাংলা রূপ আলাদা করে দেখা হবে।';return 'আল-কুরআন গবেষণা সহকারী প্রস্তুত। আপনার প্রশ্নটি বাংলায় লিখুন।'}
async function sendMessage(textOverride){if(sending)return;const text=(textOverride||input.value).trim();if(!text)return;sending=true;input.value='';addUser(text);status.textContent='উত্তর তৈরি হচ্ছে…';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,mode:mode,language:'bn'})});const raw=await r.text();let data={};try{data=JSON.parse(raw)}catch(e){}if(!r.ok||!data.answer)throw new Error(data.detail||data.error||('Worker HTTP '+r.status));addAI(data.answer,true);status.textContent='বাংলা AI চ্যাট প্রস্তুত'}catch(e){console.error(e);addAI('AI সংযোগে সমস্যা হয়েছে। স্থানীয় গবেষণা সহকারী উত্তর দিচ্ছে।\n\n'+localAnswer(),false);status.textContent='স্থানীয় সহকারী সক্রিয়'}finally{sending=false}}
function buildModes(){const bar=document.getElementById('modebar');modes.forEach(([id,label])=>{const b=document.createElement('button');b.className='mode'+(id===mode?' active':'');b.textContent=label;b.onclick=()=>{mode=id;bar.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));b.classList.add('active');addAI('মোড পরিবর্তন হয়েছে। এখন আপনার প্রশ্ন করুন।',false)};bar.appendChild(b)})}
function voice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){addAI('আপনার ব্রাউজারে বাংলা ভয়েস ইনপুট সুবিধা নেই। Chrome-এ চেষ্টা করুন।',false);return}if(listening){recognition.stop();return}recognition=new SR();recognition.lang='bn-BD';recognition.interimResults=false;recognition.maxAlternatives=1;listening=true;document.getElementById('mic').textContent='⏹️';status.textContent='🎙️ শুনছি… বাংলায় বলুন';recognition.onresult=e=>{input.value=e.results[0][0].transcript;sendMessage()};recognition.onerror=()=>{addAI('ভয়েস শুনতে সমস্যা হয়েছে। আবার 🎤 চাপুন।',false);status.textContent='বাংলা AI চ্যাট প্রস্তুত'};recognition.onend=()=>{listening=false;document.getElementById('mic').textContent='🎤';if(!sending)status.textContent='বাংলা AI চ্যাট প্রস্তুত'};recognition.start()}
function init(){buildModes();addAI('আসসালামু আলাইকুম। আমি আপনার আল-কুরআন গবেষণা সহকারী। গবেষণার প্রশ্ন বাংলায় লিখুন।',false);document.getElementById('send').onclick=()=>sendMessage();input.addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage()});document.getElementById('mic').onclick=voice;document.getElementById('speaker').onclick=()=>{speaker=!speaker;document.getElementById('speaker').classList.toggle('active',speaker);if(!speaker)speechSynthesis.cancel();setReading(false)};document.getElementById('clear').onclick=()=>{speechSynthesis.cancel();setReading(false);body.innerHTML='';addAI('চ্যাট পরিষ্কার হয়েছে। নতুন প্রশ্ন করুন।',false)};document.querySelectorAll('.quick-actions button').forEach(b=>b.onclick=()=>sendMessage(b.dataset.q));}
init();
})();
</script>
</body>
</html>

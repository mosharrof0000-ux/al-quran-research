<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
<title id="title">তিয়া — কুরআন গবেষণা AI সহকারী</title>
<desc id="desc">সবুজ টিয়া পাখি, যার দুই পাশে খোলা কুরআনের দুই পৃষ্ঠা ডানার মতো ছড়ানো।</desc>
<defs>
  <radialGradient id="bg" cx="50%" cy="35%" r="70%"><stop offset="0" stop-color="#174f43"/><stop offset="1" stop-color="#061d1c"/></radialGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#72b84b"/><stop offset=".45" stop-color="#23824c"/><stop offset="1" stop-color="#07513d"/></linearGradient>
  <linearGradient id="page" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf4"/><stop offset="1" stop-color="#e9d9a9"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7df86"/><stop offset="1" stop-color="#b88925"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".5"/></filter>
</defs>
<circle cx="128" cy="128" r="123" fill="url(#bg)" stroke="url(#gold)" stroke-width="6"/>

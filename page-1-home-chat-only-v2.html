<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>আল-কুরআন গবেষণা — হোম পেজ v2</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08151b}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="home" src="design-preview-page1-chatbox-robot-demo.html" title="আল-কুরআন গবেষণা হোম পেজ"></iframe><script>const frame=document.getElementById('home');frame.addEventListener('load',()=>{try{const doc=frame.contentDocument;const buttons=doc.querySelectorAll('.choice');const big=doc.getElementById('robot');if(buttons.length>=2){buttons.forEach(b=>b.onclick=null);buttons[0].addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const r=doc.getElementById('readRobot');r.classList.remove('reacted');void r.offsetWidth;r.classList.add('reacted')},true);buttons[1].addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const r=doc.getElementById('researchRobot');r.classList.remove('reacted');void r.offsetWidth;r.classList.add('reacted');if(big)big.style.transform='scale(1.18)';setTimeout(()=>{location.href='page-2-research-lab.html'},700)},true)}const hint=doc.querySelector('.hint');if(hint)hint.textContent='বড় রোবটে টাচ করলে চ্যাটবক্স খুলবে • গবেষণা বাটনে গেলে গবেষণা ল্যাবরেটরি খুলবে'}catch(e){console.error('হোম পেজ সংযোগ স্থাপন করা যায়নি',e)}});</script></body></html>

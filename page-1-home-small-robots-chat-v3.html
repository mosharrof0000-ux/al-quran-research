<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>আল-কুরআন গবেষণা — হোম পেজ v3 সংশোধিত</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08151b}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="home" src="design-preview-page1-chatbox-robot-demo.html" title="আল-কুরআন গবেষণা হোম পেজ"></iframe><script>const frame=document.getElementById('home');frame.addEventListener('load',()=>{try{const doc=frame.contentDocument;const win=doc.defaultView;const big=doc.getElementById('robot');const read=doc.getElementById('readRobot');const research=doc.getElementById('researchRobot');const buttons=doc.querySelectorAll('.choice');const toggle=win.toggleChat;if(big){big.onclick=null;big.addEventListener('pointerup',e=>{e.stopImmediatePropagation()},true);big.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();big.classList.remove('reacted');void big.offsetWidth;big.classList.add('reacted')},true)}if(read){read.onclick=null;read.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();read.classList.remove('reacted');void read.offsetWidth;read.classList.add('reacted');if(typeof toggle==='function')toggle('কোরআন রোবট')},true)}if(research){research.onclick=null;research.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();research.classList.remove('reacted');void research.offsetWidth;research.classList.add('reacted');if(typeof toggle==='function')toggle('গবেষণা রোবট');setTimeout(()=>{location.href='page-2-research-lab.html'},700)},true)}if(buttons.length>=2){buttons[0].onclick=null;buttons[1].onclick=null;buttons[0].addEventListener('click',e=>{if(e.target===read||read.contains(e.target))return;e.preventDefault();e.stopImmediatePropagation()},true);buttons[1].addEventListener('click',e=>{if(e.target===research||research.contains(e.target))return;e.preventDefault();e.stopImmediatePropagation()},true)}const hint=doc.querySelector('.hint');if(hint)hint.textContent='ছোট রোবটে টাচ করলে চ্যাটবক্স খুলবে • বড় রোবট কথা বলবে, চ্যাটবক্স খুলবে না'}catch(e){console.error('হোম পেজ v3 সংযোগ স্থাপন করা যায়নি',e)}});</script></body></html>

name: Connect Tafsir Library Now

on:
  push:
    branches: [main]
    paths:
      - 'tafsir-library.html'
      - '.github/workflows/connect-tafsir-library-now.yml'

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add library button
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'id="tafsir-library-link"'
          if marker in s:
              print('Already connected')
              raise SystemExit(0)
          card = '''\n      <button id="tafsir-library-link" class="hub-card" onclick="window.location.href='tafsir-library.html'">\n        <span class="emoji">📚</span>\n        <b>তাফসীর গ্রন্থাগার</b>\n        <span>ধারা, গ্রন্থ, পদ্ধতি ও তুলনামূলক গবেষণা</span>\n      </button>\n'''
          start = s.find('<section id="research"')
          if start < 0:
              start = s.find("<section id='research'")
          if start < 0:
              raise SystemExit('research section not found')
          end = s.find('</section>', start)
          if end < 0:
              raise SystemExit('research section end not found')
          s = s[:end] + card + s[end:]
          p.write_text(s, encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'তাফসীর গ্রন্থাগার মূল মেনুতে যুক্ত করা হলো'
          git push

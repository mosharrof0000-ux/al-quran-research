name: Deterministic chat routing regression

on:
  pull_request:
    paths:
      - 'backend/worker-entry.js'
      - 'backend/worker.js'
      - 'backend/private-research.js'
      - 'scripts/test-deterministic-chat-routing.mjs'
      - '.github/workflows/deterministic-chat-routing.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/worker-entry.js'
      - 'backend/worker.js'
      - 'backend/private-research.js'
      - 'scripts/test-deterministic-chat-routing.mjs'
      - '.github/workflows/deterministic-chat-routing.yml'

permissions:
  contents: read

jobs:
  deterministic-route:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test deterministic verified-data routing without network access
        run: node scripts/test-deterministic-chat-routing.mjs

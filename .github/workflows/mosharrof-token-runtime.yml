name: Mosharrof Token Runtime

on:
  push:
    branches:
      - feature/dynamic-entity-token-engine-v0-1
      - main
  pull_request:

permissions:
  contents: read

jobs:
  token-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run token runtime contract
        run: node scripts/mosharrof_token_runtime_test.mjs

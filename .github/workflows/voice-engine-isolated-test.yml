name: Voice Engine Isolated Test

on:
  push:
    branches:
      - feat/context-aware-smart-voice-engine-v1

jobs:
  test-voice-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node backend/voice-engine.test.js

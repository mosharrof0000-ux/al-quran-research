name: Discover Cloudflare Worker Route

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/discover-cloudflare-route.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Discover Wrangler account and Workers subdomain
        working-directory: backend
        run: |
          set -euo pipefail
          npx --yes wrangler whoami
          ACCOUNT_ID="$(npx --yes wrangler whoami 2>/dev/null | sed -n 's/.*Account ID: \([^ ]*\).*/\1/p' | head -n1)"
          if [ -z "$ACCOUNT_ID" ]; then
            echo "ACCOUNT_ID_NOT_FOUND"
            exit 1
          fi
          echo "ACCOUNT_ID=$ACCOUNT_ID"
          echo "WORKERS_SUBDOMAIN_RESPONSE="
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/subdomain"
          echo

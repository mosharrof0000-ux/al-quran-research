name: Discover Cloudflare Worker Route

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/discover-cloudflare-route.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 5deb168bbc31c47db0419913860fce21

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Discover Workers subdomain
        run: |
          set -euo pipefail
          echo "Cloudflare account: $CLOUDFLARE_ACCOUNT_ID"
          echo "WORKERS_SUBDOMAIN_RESPONSE="
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          echo

name: Discover Cloudflare Worker Route

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/discover-cloudflare-route.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 5deb168bbc31c47db0419913860fce21

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Worker route and chat
        run: |
          set -euo pipefail
          URL='https://al-quran-research.mosharrof0000.workers.dev'
          ORIGIN='https://mosharrof0000-ux.github.io'
          echo '=== Worker diagnostic ==='
          curl -fsS --connect-timeout 8 --max-time 20 \
            -H "Origin: $ORIGIN" "$URL/diagnostic"
          echo
          echo '=== CORS preflight ==='
          curl -fsS -D - -o /dev/null -X OPTIONS \
            -H "Origin: $ORIGIN" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' \
            "$URL/"
          echo '=== Real chat POST ==='
          curl -fsS --connect-timeout 8 --max-time 45 \
            -H "Origin: $ORIGIN" \
            -H 'Content-Type: application/json' \
            --data '{"message":"আপনি কেমন আছেন","mode":"general","language":"bn"}' \
            "$URL/"
          echo

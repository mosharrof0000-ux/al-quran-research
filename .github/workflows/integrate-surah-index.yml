name: পূর্ণ সূরা সূচি যুক্ত করা

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: মূল index.html-এ ১–১১৪ সূরার তালিকা বসানো

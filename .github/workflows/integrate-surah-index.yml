১১','আল-মাসাদ','৫ আয়াত • মক্কী'),('১১২','আল-ইখলাস','৪ আয়াত • মক্কী'),('১১৩','আল-ফালাক','৫ আয়াত • মক্কী'),('১১৪','আন-নাস','৬ আয়াত • মক্কী')
          ]

          rows = []
          for i, (num, name, info) in enumerate(surahs):
              click = " onclick=\"show('reading')\"" if i == 0 else ''
              rows.append(f'  <div class="surah-row"{click}><span class="surah-num">{num}</span><div><b>{name}</b><small>{info}</small></div><span class="chev">›</span></div>')
          block = '<div class="surah-list" id="surahList">\n' + '\n'.join(rows) + '\n </div>'

          start = s.index(' <div class="surah-list" id="surahList">')
          end = s.index(' </div>', start) + len(' </div>')
          s = s[:start] + ' ' + block + s[end:]
          p.write_text(s, encoding='utf-8')

      - name: পরিবর্তন সংরক্ষণ
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "কোনো পরিবর্তন নেই"
            exit 0
          fi
          git commit -m "মূল index.html-এ ১–১১৪ সূরার পূর্ণ সূচি যুক্ত"
          git push

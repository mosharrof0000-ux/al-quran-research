name: Research Record Approval

on:
  workflow_dispatch:
    inputs:
      proposal_json:
        description: 'PENDING_REVIEW research_record_proposal JSON'
        required: true
        type: string
      approval:
        description: 'Type APPROVE to authorize a new versioned research record'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: research-record-approval-main
  cancel-in-progress: false

jobs:
  approve-and-save:
    if: ${{ inputs.approval == 'APPROVE' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate proposal and create next immutable version
        env:
          PROPOSAL_JSON: ${{ inputs.proposal_json }}
          APPROVED_BY: ${{ github.actor }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, pathlib, re
          proposal=json.loads(os.environ['PROPOSAL_JSON'])
          if proposal.get('status') != 'PENDING_REVIEW':
              raise SystemExit('REJECTED: proposal status must be PENDING_REVIEW')
          if proposal.get('save_policy') != 'APPROVAL_REQUIRED_NO_MASTER_OVERWRITE':
              raise SystemExit('REJECTED: invalid save policy')
          if not isinstance(proposal.get('question'), str) or not proposal['question'].strip():
              raise SystemExit('REJECTED: question is required')
          scope_obj=proposal.get('scope')
          scope=scope_obj.get('ayah_id') if isinstance(scope_obj,dict) else None
          if not isinstance(scope,str) or not re.fullmatch(r'S\\d{3}-A\\d{3}',scope):
              raise SystemExit('REJECTED: canonical scope.ayah_id required')
          refs=proposal.get('source_refs')
          if not isinstance(refs,list) or not refs:
              raise SystemExit('REJECTED: source_refs required')
          for ref in refs:
              if not isinstance(ref,dict):
                  raise SystemExit('REJECTED: source_refs entries must be objects')
              source_file=ref.get('source_file')
              record_id=ref.get('record_id')
              if source_file:
                  p=pathlib.PurePosixPath(str(source_file))
                  if p.is_absolute() or '..' in p.parts or not pathlib.Path(str(source_file)).is_file():
                      raise SystemExit('REJECTED: source_file must be an existing repository file')
              elif record_id:
                  if not re.fullmatch(r'[A-Za-z0-9_-]+',str(record_id)):
                      raise SystemExit('REJECTED: invalid source record_id')
              else:
                  raise SystemExit('REJECTED: each source_ref needs source_file or record_id')
          if not isinstance(proposal.get('findings'),list) or not proposal['findings']:
              raise SystemExit('REJECTED: at least one finding is required')
          root=pathlib.Path('data/research-records')
          index_path=root/'index.json'
          if not index_path.is_file():
              raise SystemExit('REJECTED: research record index missing')
          index=json.loads(index_path.read_text(encoding='utf-8'))
          if index.get('schema_version') != 1 or not isinstance(index.get('records'),list):
              raise SystemExit('REJECTED: research record index invalid')
          candidates=[]
          for p in root.glob('*.json'):
              if p.name == 'index.json' or p.name.endswith('.schema.json'):
                  continue
              try:
                  d=json.loads(p.read_text(encoding='utf-8'))
                  if d.get('scope',{}).get('ayah_id')==scope:
                      candidates.append((int(d.get('version',0)),p,d))
              except Exception:
                  continue
          previous=max(candidates,key=lambda x:x[0]) if candidates else None
          next_version=(previous[0]+1) if previous else 1
          new_id=f"RR-{scope.replace('-','')}-V{next_version}"
          out=root/(new_id+'.json')
          if out.exists():
              raise SystemExit('REJECTED: target version already exists')
          proposal['record_id']=new_id
          proposal['version']=next_version
          proposal['status']='VERIFIED'
          proposal['supersedes']=previous[2].get('record_id') if previous else None
          proposal['approved_by']=os.environ.get('APPROVED_BY','unknown')
          proposal['approval_basis']='Manual GitHub Actions dispatch with explicit APPROVE input'
          proposal['approved_at']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          proposal.pop('record_id_proposal',None)
          out.write_text(json.dumps(proposal,ensure_ascii=False,indent=2)+'\\n',encoding='utf-8')
          entry={'file':out.name,'record_id':new_id,'version':next_version,'status':'VERIFIED','ayah_id':scope,'updated_at':datetime.datetime.now(datetime.timezone.utc).date().isoformat()}
          if any(x.get('file')==out.name for x in index['records'] if isinstance(x,dict)):
              raise SystemExit('REJECTED: index already contains target file')
          index['records'].append(entry)
          index['records'].sort(key=lambda x:(str(x.get('ayah_id','')),int(x.get('version',0))))
          index_path.write_text(json.dumps(index,ensure_ascii=False,indent=2)+'\\n',encoding='utf-8')
          print(f"Created {out} version={next_version} supersedes={proposal['supersedes']}; index updated")
          PY

      - name: Verify master dataset unchanged
        run: |
          git diff --exit-code -- data/fatiha-master-v1.json

      - name: Commit approved research record and index
        run: |
          git config user.name 'al-quran-research approval bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research-records/
          git diff --cached --quiet && { echo 'No record change'; exit 1; }
          git commit -m 'Approve and save versioned research record'
          git push origin main

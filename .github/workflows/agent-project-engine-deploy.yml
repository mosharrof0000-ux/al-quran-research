name: Deploy Isolated Project Agent Engine

on:
  push:
    branches:
      - agent/project-engine-v1-isolated
    paths:
      - 'backend/project-agent/**'
      - '.github/workflows/agent-project-engine-deploy.yml'

permissions:
  contents: read

jobs:
  deploy-agent-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v6

      - name: Deploy isolated Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: backend/project-agent
          command: deploy

      - name: Smoke test isolated health endpoint
        run: |
          set -euo pipefail
          URL='https://al-quran-research-project-agent.workers.dev'
          ORIGIN='https://mosharrof0000-ux.github.io'

          echo "Checking isolated engine health..."
          BODY="$(curl -fsS --connect-timeout 8 --max-time 20 -H "Origin: $ORIGIN" "$URL/")"
          echo "$BODY"
          echo "$BODY" | grep -q '"isolated":true'
          echo "$BODY" | grep -q '"merge":false'
          echo "$BODY" | grep -q '"deploy":false'

      - name: Verify production Worker is not targeted
        run: |
          set -euo pipefail
          test 'https://al-quran-research-project-agent.workers.dev' != 'https://al-quran-research.mosharrof0000.workers.dev'

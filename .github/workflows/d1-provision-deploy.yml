name: Provision D1 and Deploy Worker

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'database/**'
      - 'migrations/**'
      - '.github/workflows/d1-provision-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  DB_NAME: al-quran-research-db

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Provision or find D1
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          LIST_JSON="$(npx --yes wrangler@latest d1 list --json)"
          DB_ID="$(printf '%s' "$LIST_JSON" | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              const x=JSON.parse(s);
              const rows=Array.isArray(x)?x:(x.result||x.databases||[]);
              const r=rows.find(v=>v.name===process.env.DB_NAME);
              process.stdout.write(r?.uuid||r?.database_id||"");
            });
          ')"
          if [ -z "$DB_ID" ]; then
            echo "D1 '$DB_NAME' not found; creating it."
            OUT="$(npx --yes wrangler@latest d1 create "$DB_NAME" --location apac)"
            printf '%s\n' "$OUT"
            DB_ID="$(printf '%s\n' "$OUT" | grep -Eo '[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,}' | head -n1 || true)"
          fi
          if [ -z "$DB_ID" ]; then
            echo "Could not determine D1 database ID."
            exit 1
          fi
          echo "D1 database ready: $DB_NAME"
          echo "DB_ID=$DB_ID" >> "$GITHUB_ENV"

      - name: Generate D1-bound Wrangler config
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const base=fs.readFileSync('wrangler.jsonc','utf8');
          const i=base.lastIndexOf('}');
          if(i<0) throw new Error('Invalid Wrangler config');
          const binding=',\n  "d1_databases": [{\n    "binding": "DB",\n    "database_name": "'+process.env.DB_NAME+'",\n    "database_id": "'+process.env.DB_ID+'"\n  }]\n';
          fs.writeFileSync('/tmp/wrangler-d1.jsonc',base.slice(0,i)+binding+base.slice(i));
          NODE

      - name: Apply D1 migrations
        working-directory: backend
        run: |
          npx --yes wrangler@latest d1 migrations apply "$DB_NAME" --remote --config /tmp/wrangler-d1.jsonc --yes

      - name: Seed Fatiha pilot when database is empty
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(npx --yes wrangler@latest d1 execute "$DB_NAME" --remote --config /tmp/wrangler-d1.jsonc --json --command 'SELECT COUNT(*) AS c FROM surah' | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              const x=JSON.parse(s);
              const row=(x[0]?.results||x.result?.[0]?.results||[])[0] || {};
              process.stdout.write(String(row.c??0));
            });
          ')"
          echo "surah rows: $COUNT"
          if [ "$COUNT" = "0" ]; then
            npx --yes wrangler@latest d1 execute "$DB_NAME" --remote --config /tmp/wrangler-d1.jsonc --file ../database/pilot_fatiha_v0.1.sql --yes
          else
            echo "Existing research data found; seed skipped."
          fi

      - name: Deploy Worker with D1 binding
        working-directory: backend
        run: |
          npx --yes wrangler@latest deploy --config /tmp/wrangler-d1.jsonc

      - name: Verify D1 data
        working-directory: backend
        run: |
          npx --yes wrangler@latest d1 execute "$DB_NAME" --remote --config /tmp/wrangler-d1.jsonc --json --command 'SELECT COUNT(*) AS surahs FROM surah; SELECT COUNT(*) AS ayahs FROM ayah; SELECT COUNT(*) AS tokens FROM token;'

name: Set Tiya Site Favicon (Legacy — Canonical Sync Replaced)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Canonical automation notice
        run: |
          echo 'This legacy workflow no longer writes index.html or favicon.svg.'
          echo 'Use .github/workflows/live-entrypoint-sync.yml as the canonical live-entrypoint writer.'

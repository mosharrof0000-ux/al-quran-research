name: Link Integrity Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'ui/home-v1/home-v1.html'
      - 'ui/home-v1/home-v1.js'
      - '.github/workflows/link-integrity.yml'

permissions:
  contents: read

jobs:
  verify-project-link:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify canonical live entrypoint
        shell: bash
        run: |
          set -euo pipefail
          base='https://mosharrof0000-ux.github.io/al-quran-research'
          source="$base/index.html?integrity=$GITHUB_SHA"
          html="$(curl -fsSL --retry 5 --retry-delay 2 "$source")"
          printf '%s\n' "$html" | grep -Fq 'ui/home-v1/home-v1.html'
          printf '%s\n' "$html" | grep -Fq 'id="homeApp"'

      - name: Verify current home-v1 identity
        shell: bash
        run: |
          set -euo pipefail
          base='https://mosharrof0000-ux.github.io/al-quran-research'
          target="$base/ui/home-v1/home-v1.html?integrity=$GITHUB_SHA"
          html="$(curl -fsSL --retry 5 --retry-delay 2 "$target")"
          printf '%s\n' "$html" | grep -Fq 'id="quranHome"'
          printf '%s\n' "$html" | grep -Fq 'id="quranReader"'
          printf '%s\n' "$html" | grep -Fq 'id="sourceList"'

      - name: Verify source label in current reader script
        shell: bash
        run: |
          set -euo pipefail
          base='https://mosharrof0000-ux.github.io/al-quran-research'
          target="$base/ui/home-v1/home-v1.js?integrity=$GITHUB_SHA"
          html="$(curl -fsSL --retry 5 --retry-delay 2 "$target")"
          printf '%s\n' "$html" | grep -Fq 'ভাষাভিত্তিক কুরআন'

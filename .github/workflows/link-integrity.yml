name: Link Integrity Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'ui/home-v1/home-v1.html'
      - '.github/workflows/link-integrity.yml'

permissions:
  contents: read

jobs:
  verify-project-link:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify canonical live entrypoint
        shell: bash
        run: |
          set -euo pipefail
          base='https://mosharrof0000-ux.github.io/al-quran-research'
          source="$base/index.html"
          for attempt in $(seq 1 36); do
            if html="$(curl -fsSL --retry 3 --retry-delay 2 "$source")" &&
               printf '%s
' "$html" | grep -Fq 'ui/home-v1/home-v1.html' &&
               printf '%s
' "$html" | grep -Fq 'id="homeApp"'; then
              exit 0
            fi
            sleep 5
          done
          echo "Canonical live entrypoint verification timed out."
          exit 1

      - name: Verify current home-v1 identity
        shell: bash
        run: |
          set -euo pipefail
          target='https://mosharrof0000-ux.github.io/al-quran-research/ui/home-v1/home-v1.html'
          for attempt in $(seq 1 36); do
            if html="$(curl -fsSL --retry 3 --retry-delay 2 "$target")" &&
               printf '%s
' "$html" | grep -Fq 'id="quranHome"' &&
               printf '%s
' "$html" | grep -Fq 'ভাষাভিত্তিক কুরআন' &&
               printf '%s
' "$html" | grep -Fq 'id="quranReader"'; then
              exit 0
            fi
            sleep 5
          done
          echo "Current home-v1 identity verification timed out."
          exit 1

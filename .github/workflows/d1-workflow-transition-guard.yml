name: D1 Workflow Transition Guard

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/d1-workflow-transition-guard.yml'
      - '.github/workflows/d1-provision-deploy.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: d1-workflow-transition-guard
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commit and parent for exact changed-path detection
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Disable legacy D1 workflow when this guard is first installed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CHANGED="$(git diff --name-only HEAD^ HEAD)"
          if printf '%s\n' "$CHANGED" | grep -Fxq '.github/workflows/d1-workflow-transition-guard.yml'; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/365243636/disable"
            echo "Legacy D1 workflow disabled."
          fi
          if printf '%s\n' "$CHANGED" | grep -Fxq '.github/workflows/d1-provision-deploy.yml'; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/365243636/enable"
            echo "Manual-only D1 workflow enabled after replacement."
          fi

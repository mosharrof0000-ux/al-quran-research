name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-worker.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: backend
          command: deploy --config wrangler.jsonc

      - name: Smoke test Worker diagnostic and chat
        run: |
          set -e
          URL='https://al-quran-research.mosharroff0000.workers.dev'
          ORIGIN='https://mosharrof0000-ux.github.io'

          echo "Waiting for Worker DNS/route to become reachable..."
          for i in $(seq 1 30); do
            if curl -fsS --connect-timeout 3 --max-time 8 \
              -H "Origin: $ORIGIN" "$URL/diagnostic"; then
              echo
              echo "Worker diagnostic is reachable."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Worker DNS/route was not reachable after 60 seconds."
              exit 1
            fi
            sleep 2
          done

          echo "Checking CORS preflight..."
          curl -fsS -o /dev/null -D - -X OPTIONS \
            -H "Origin: $ORIGIN" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' \
            "$URL/"

          echo "Checking real POST chat path..."
          curl -fsS --connect-timeout 5 --max-time 30 \
            -H "Origin: $ORIGIN" \
            -H 'Content-Type: application/json' \
            --data '{"message":"আপনি কেমন আছেন","mode":"general","language":"bn"}' \
            "$URL/"
          echo

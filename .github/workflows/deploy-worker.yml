name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-worker.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: backend
          command: deploy --config wrangler.jsonc

      - name: Smoke test Worker diagnostic
        run: |
          set -e
          echo "Checking Worker diagnostic endpoint..."
          curl -fsS --retry 3 --retry-delay 2 \
            -H 'Origin: https://mosharrof0000-ux.github.io' \
            'https://al-quran-research.mosharroff0000.workers.dev/diagnostic'
          echo
          echo "Checking CORS preflight..."
          curl -fsS -o /dev/null -D - -X OPTIONS \
            -H 'Origin: https://mosharrof0000-ux.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' \
            'https://al-quran-research.mosharroff0000.workers.dev/'

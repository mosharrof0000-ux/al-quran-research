name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-worker.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: backend
          command: deploy --config wrangler.jsonc

      - name: Smoke test Worker diagnostic and chat
        run: |
          set -euo pipefail
          URL='https://al-quran-research.mosharroff0000.workers.dev'
          ORIGIN='https://mosharroff0000-ux.github.io'

          echo "Checking Worker diagnostic..."
          curl -fsS --connect-timeout 8 --max-time 20 \
            -H "Origin: $ORIGIN" "$URL/diagnostic"
          echo

          echo "Checking CORS preflight..."
          curl -fsS -o /dev/null -D - -X OPTIONS \
            -H "Origin: $ORIGIN" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' \
            "$URL/"

          echo "Checking real POST chat path..."
          curl -fsS --connect-timeout 8 --max-time 45 \
            -H "Origin: $ORIGIN" \
            -H 'Content-Type: application/json' \
            --data '{"message":"আপনি কেমন আছেন","mode":"general","language":"bn"}' \
            "$URL/"
          echo

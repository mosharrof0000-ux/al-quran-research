name: Deploy Cloudflare Worker

# D1 provisioning + Worker deployment is handled by d1-provision-deploy.yml.
# Keep this workflow manual so two deploy workflows cannot race and overwrite
# the D1-bound Worker with the base Wrangler configuration.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Normalize and validate Cloudflare token
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="${CLOUDFLARE_API_TOKEN//
          if [ -z "$TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is empty."
            exit 1
          fi
          case "$TOKEN" in
            Bearer\ *|Basic\ *)
              echo "Store the raw Cloudflare API token in the GitHub secret."
              exit 1
              ;;
          esac
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          workingDirectory: backend
          command: deploy --config wrangler.jsonc

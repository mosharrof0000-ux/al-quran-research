<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>রোবট কাজের পেজ — Cloudflare AI সংস্করণ ১</title>
<style>
:root{--h:158;--gold:hsl(calc(var(--h)+58) 78% 70%)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Noto Sans Bengali",system-ui,sans-serif}body{overflow:hidden;background:hsl(var(--h) 55% 12%);transition:background 8s;color:#fff}.home{min-height:100svh;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 42%,hsl(calc(var(--h)+25) 70% 42%/.2),transparent 27%),radial-gradient(circle at 12% 15%,hsl(calc(var(--h)+55) 80% 60%/.16),transparent 32%),linear-gradient(145deg,hsl(var(--h) 60% 11%),hsl(calc(var(--h)+38) 58% 19%),hsl(calc(var(--h)+82) 52% 13%));transition:background 8s}.layer{position:absolute;border:1px solid #ffffff18;border-radius:50%;pointer-events:none;left:50%;top:42%;transform:translate(-50%,-50%)}.l1{width:92vw;height:92vw;max-width:620px;max-height:620px;box-shadow:0 0 90px hsl(var(--h) 80% 60%/.12);animation:spin 35s linear infinite}.l2{width:70vw;height:70vw;max-width:470px;max-height:470px;border-style:dashed;animation:spin 28s linear infinite reverse}.l3{width:48vw;height:48vw;max-width:320px;max-height:320px;box-shadow:inset 0 0 45px hsl(calc(var(--h)+55) 80% 70%/.1);animation:pulse 5s ease-in-out infinite}.robot{position:fixed;z-index:20;width:126px;height:150px;left:50%;top:22%;touch-action:none;cursor:grab;user-select:none;filter:drop-shadow(0 18px 28px #0007);animation:bob 3.2s ease-in-out infinite}.robot:active{cursor:grabbing}.head{position:absolute;left:10px;top:10px;width:106px;height:88px;border-radius:38% 38% 43% 43%;background:linear-gradient(145deg,#f7ffff,#b9dfe0);border:3px solid #ffffffaa;box-shadow:inset 0 -10px 18px #277a7a33,0 0 30px hsl(var(--h) 80% 65%/.35)}.eye{position:absolute;top:30px;width:19px;height:27px;border-radius:50%;background:#102a38;box-shadow:inset 5px 4px 0 #fff;animation:look 5s ease-in-out infinite,blink 6s infinite}.eye.left{left:24px}.eye.right{right:24px}.mouth{position:absolute;left:43px;top:61px;width:20px;height:10px;border-bottom:3px solid #214b58;border-radius:50%;animation:happy 4s ease-in-out infinite}.body{position:absolute;left:28px;top:91px;width:70px;height:53px;border-radius:22px 22px 28px 28px;background:linear-gradient(145deg,hsl(calc(var(--h)+25) 75% 56%),hsl(calc(var(--h)+60) 72% 45%));border:2px solid #ffffff66;box-shadow:0 0 22px hsl(var(--h) 80% 60%/.22)}.antenna{position:absolute;left:59px;top:-4px;width:8px;height:19px;background:#bde5e2}.antenna:after{content:"";position:absolute;left:-4px;top:-10px;width:16px;height:16px;border-radius:50%;background:var(--gold);box-shadow:0 0 20px var(--gold);animation:glow 1.5s infinite}.arm{position:absolute;top:101px;width:20px;height:45px;border-radius:15px;background:#c5e6e5}.arm.left{left:13px;transform:rotate(18deg);animation:wave 2.8s infinite}.arm.right{right:13px;transform:rotate(-18deg)}.heart{position:absolute;left:25px;top:8px;font-size:13px;animation:heart 1.6s infinite}@keyframes bob{50%{margin-top:-9px}}@keyframes look{0%,20%{transform:translateX(-4px)}35%,65%{transform:translateX(5px)}80%,100%{transform:translateX(-2px)}}@keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%,47%{transform:scaleY(.08)}}@keyframes happy{50%{width:27px;height:14px;left:39px}}@keyframes wave{50%{transform:rotate(34deg)}}@keyframes glow{50%{opacity:.45;transform:scale(.72)}}@keyframes heart{50%{transform:scale(1.3) rotate(8deg)}}@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.06);opacity:.7}}@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.chat-toggle{position:fixed;z-index:40;right:18px;bottom:18px;border:1px solid #ffffff35;border-radius:999px;padding:13px 18px;background:#ffffff18;color:#fff;backdrop-filter:blur(12px);box-shadow:0 8px 28px #0005;font:inherit;font-weight:700;cursor:pointer}.chat-toggle:active{transform:scale(.97)}.chat{position:fixed;z-index:50;left:12px;right:12px;bottom:76px;margin:auto;max-width:620px;height:min(66svh,560px);display:none;flex-direction:column;border:1px solid #ffffff30;border-radius:24px;background:#071b1bd9;backdrop-filter:blur(20px);box-shadow:0 20px 70px #0008;overflow:hidden}.chat.open{display:flex}.chat-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #ffffff18}.chat-title{font-weight:800}.chat-status{font-size:12px;opacity:.65}.close{border:0;background:#ffffff12;color:#fff;width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer}.messages{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}.msg{max-width:84%;padding:10px 13px;border-radius:16px;line-height:1.55;white-space:pre-wrap}.bot{align-self:flex-start;background:#ffffff12;border:1px solid #ffffff12}.user{align-self:flex-end;background:hsl(var(--h) 45% 32%/.65);border:1px solid #ffffff18}.empty{opacity:.6;text-align:center;margin:auto;font-size:14px}.quick{display:flex;gap:7px;overflow:auto;padding:0 12px 10px}.quick button{white-space:nowrap;border:1px solid #ffffff20;background:#ffffff0d;color:#fff;border-radius:999px;padding:7px 10px;font:inherit;font-size:12px;cursor:pointer}.composer{display:flex;gap:8px;padding:12px;border-top:1px solid #ffffff18}.composer input{flex:1;min-width:0;border:1px solid #ffffff22;border-radius:15px;background:#ffffff0d;color:#fff;padding:12px;font:inherit;outline:none}.composer input::placeholder{color:#ffffff80}.send{border:0;border-radius:15px;padding:0 16px;background:var(--gold);color:#142b2b;font:inherit;font-weight:800;cursor:pointer}.ai-badge{font-size:11px;margin-left:8px;padding:3px 7px;border-radius:999px;background:#ffffff12;border:1px solid #ffffff18}@media(max-width:430px){.robot{transform:scale(.9);transform-origin:center}.chat{height:68svh;bottom:72px}.chat-toggle{right:12px;bottom:12px}}
</style>
</head>
<body>
<main class="home"><div class="layer l1"></div><div class="layer l2"></div><div class="layer l3"></div><div class="robot" id="robot" aria-label="চঞ্চল AI রোবট"><div class="antenna"></div><div class="head"><div class="eye left"></div><div class="eye right"></div><div class="mouth"></div></div><div class="body"><span class="heart">✦</span></div><div class="arm left"></div><div class="arm right"></div></div></main>
<button class="chat-toggle" id="chatToggle">💬 চ্যাট</button>
<section class="chat" id="chat" aria-label="চ্যাট প্যানেল"><div class="chat-head"><div><div class="chat-title">AI গবেষণা চ্যাট <span class="ai-badge">Cloudflare AI</span></div><div class="chat-status" id="status">AI Worker সংযোগ পরীক্ষা করা হচ্ছে…</div></div><button class="close" id="closeChat" aria-label="বন্ধ করুন">×</button></div><div class="messages" id="messages"><div class="empty" id="empty">এখানে প্রশ্ন লিখুন। এই পেজটি Cloudflare Worker-এর মাধ্যমে AI উত্তরের জন্য সংযুক্ত।</div></div><div class="quick"><button data-q="এই পেজে কী কী করা যাবে?">এই পেজে কী করা যাবে?</button><button data-q="কোরআন গবেষণা কীভাবে শুরু করব?">গবেষণা শুরু</button><button data-q="ভবিষ্যতে AI কীভাবে যুক্ত হবে?">ভবিষ্যৎ AI</button></div><form class="composer" id="composer"><input id="input" autocomplete="off" placeholder="আপনার প্রশ্ন লিখুন…"><button class="send" type="submit">পাঠান</button></form></section>
<script>
const WORKER_URL='https://al-quran-research.mosharrof0000.workers.dev/';
const r=document.getElementById('robot');let drag=false,dx=0,dy=0;r.addEventListener('pointerdown',e=>{drag=true;r.setPointerCapture(e.pointerId);const q=r.getBoundingClientRect();dx=e.clientX-q.left;dy=e.clientY-q.top;r.style.animation='none'});r.addEventListener('pointermove',e=>{if(!drag)return;r.style.left=(e.clientX-dx)+'px';r.style.top=(e.clientY-dy)+'px';r.style.transform='none'});r.addEventListener('pointerup',()=>{drag=false;r.style.animation='bob 3.2s ease-in-out infinite'});const hues=[158,188,222,258,286,42];let i=0;setInterval(()=>{i=(i+1)%hues.length;document.documentElement.style.setProperty('--h',hues[i])},18000);
const chat=document.getElementById('chat'),toggle=document.getElementById('chatToggle'),close=document.getElementById('closeChat'),messages=document.getElementById('messages'),empty=document.getElementById('empty'),input=document.getElementById('input'),composer=document.getElementById('composer'),status=document.getElementById('status');function openChat(){chat.classList.add('open');input.focus()}function add(text,who){if(empty)empty.remove();const d=document.createElement('div');d.className='msg '+who;d.textContent=text;messages.appendChild(d);messages.scrollTop=messages.scrollHeight}
async function askAI(q){const res=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q})});if(!res.ok)throw new Error('Worker HTTP '+res.status);const data=await res.json();return data.reply||data.text||'AI থেকে উত্তর পাওয়া যায়নি।'}
async function checkWorker(){try{const res=await fetch(WORKER_URL,{method:'GET'});if(res.ok){status.textContent='Cloudflare Worker অনলাইন';}else{status.textContent='Worker পাওয়া গেছে, HTTP '+res.status;}}catch(e){status.textContent='Worker সংযোগ পরীক্ষা ব্যর্থ';}}
toggle.onclick=openChat;close.onclick=()=>chat.classList.remove('open');document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>{openChat();input.value=b.dataset.q;composer.requestSubmit()});composer.addEventListener('submit',async e=>{e.preventDefault();const q=input.value.trim();if(!q)return;add(q,'user');input.value='';status.textContent='AI উত্তর তৈরি হচ্ছে…';try{add(await askAI(q),'bot');status.textContent='Cloudflare Worker সংযুক্ত';}catch(err){add('AI সংযোগে সমস্যা হয়েছে: '+err.message,'bot');status.textContent='সংযোগ পরীক্ষা প্রয়োজন'}});checkWorker();
</script>
</body></html>

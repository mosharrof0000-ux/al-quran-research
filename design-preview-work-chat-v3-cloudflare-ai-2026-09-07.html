<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>আল-কুরআন গবেষণা — গবেষণা চ্যাট</title>
<style>
:root{--h:158;--gold:hsl(calc(var(--h)+58) 78% 70%);--bg:hsl(var(--h) 55% 10%);--panel:hsl(var(--h) 38% 9%/.78);--line:#ffffff20}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:"Noto Sans Bengali",system-ui,sans-serif}body{overflow:hidden;background:var(--bg);color:#fff;transition:background 8s}.app{position:fixed;inset:0;border:0;border-radius:0;overflow:hidden;background:radial-gradient(circle at 80% 10%,hsl(calc(var(--h)+45) 80% 70%/.10),transparent 25%),radial-gradient(circle at 10% 90%,hsl(calc(var(--h)+110) 70% 55%/.08),transparent 28%),var(--panel);backdrop-filter:blur(20px);transition:background 8s}.top{height:64px;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:#ffffff08}.top button{width:42px;height:42px;border:0;border-radius:13px;background:#ffffff0b;color:#fff;font-size:22px;cursor:pointer}.title{text-align:center;font-weight:800;font-size:16px}.status{text-align:center;font-size:11px;opacity:.55;margin-top:2px}.messages{position:absolute;top:64px;bottom:154px;left:0;right:0;overflow:auto;padding:22px 0;display:flex;flex-direction:column;gap:14px}.empty{margin:auto;opacity:.35;text-align:center;font-size:14px}.msg{line-height:1.65;white-space:pre-wrap;font-size:15px}.bot{align-self:stretch;width:100%;max-width:none;box-sizing:border-box;padding:14px 12px;background:transparent;border:0}.userRow{align-self:flex-end;width:100%;display:flex;flex-direction:column;align-items:flex-end;padding:0 12px}.user{display:inline-block;width:auto;max-width:min(820px,86vw);padding:12px 15px;border-radius:18px;background:hsl(var(--h) 45% 32%/.55);border:1px solid #ffffff18}.actions{display:flex;gap:5px;margin-top:5px;opacity:.65}.actions button{border:0;background:transparent;color:#fff;font:inherit;font-size:12px;padding:4px 7px;border-radius:8px;cursor:pointer}.actions button:hover{background:#ffffff12;opacity:1}.composer{position:absolute;left:0;right:0;bottom:0;min-height:154px;display:flex;align-items:flex-end;padding:12px clamp(10px,2.5vw,28px) calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#0003}.composerBox{position:relative;width:100%;min-height:126px;border:1px solid hsl(var(--h) 65% 65%/.38);border-radius:26px;background:linear-gradient(145deg,#ffffff12,#ffffff05 48%,hsl(var(--h) 55% 30%/.12));backdrop-filter:blur(16px);overflow:hidden;box-shadow:0 10px 34px #0007,0 0 24px hsl(var(--h) 85% 60%/.14),inset 0 1px 0 #ffffff28;transition:border-color .5s,box-shadow .5s,background 1.5s}.composerBox::before{content:"";position:absolute;inset:-45%;pointer-events:none;background:conic-gradient(from 0deg,transparent 0 28%,hsl(var(--h) 90% 70%/.18) 38%,transparent 48% 68%,hsl(calc(var(--h) + 70) 90% 70%/.13) 78%,transparent 88%);animation:composerGlow 9s linear infinite;filter:blur(22px)}.composerBox::after{content:"";position:absolute;inset:1px;border-radius:25px;pointer-events:none;background:linear-gradient(125deg,#ffffff18,transparent 24%,transparent 72%,hsl(var(--h) 80% 65%/.10));mix-blend-mode:screen}@keyframes composerGlow{to{transform:rotate(360deg)}}.composerBox:focus-within{border-color:hsl(var(--h) 78% 72%/.78);box-shadow:0 14px 42px #0008,0 0 34px hsl(var(--h) 85% 65%/.22),inset 0 1px 0 #ffffff38}.composer textarea{position:relative;z-index:2;display:block;width:100%;height:126px;min-height:126px;max-height:38vh;resize:none;border:0;background:transparent;color:#fff;padding:17px 112px 54px 18px;font:inherit;line-height:1.55;outline:none;overflow-y:auto}.composer textarea::placeholder{color:#ffffff70}.composer button{position:absolute;z-index:3;right:11px;bottom:11px;height:42px;border:0;border-radius:14px;background:hsl(var(--h) 70% 48%);color:#fff;padding:0 18px;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 0 14px hsl(var(--h) 90% 65%/.45),0 5px 16px #0006,inset 0 1px 0 #ffffff55;transition:background 1.5s,box-shadow 1.5s,transform .15s}.composer button:hover{transform:translateY(-1px);box-shadow:0 0 24px hsl(var(--h) 90% 65%/.7),0 7px 20px #0007,inset 0 1px 0 #ffffff66}.composer button:active{transform:translateY(1px)}.drawer{position:absolute;top:0;bottom:0;width:min(340px,86vw);z-index:20;background:hsl(var(--h) 34% 8%/.96);backdrop-filter:blur(24px);box-shadow:0 0 35px #0008;padding:76px 20px 20px;transition:transform .3s ease}.left{left:0;transform:translateX(-105%)}.right{right:0;transform:translateX(105%)}.drawer.open{transform:translateX(0)}.drawer h3{margin:0 0 18px;font-size:18px;text-align:center}.drawer p{font-size:12px;opacity:.6;line-height:1.7;text-align:center;min-height:42px;margin:0 0 12px}.drawer button{width:100%;text-align:center;margin:6px 0;padding:13px 14px;border:0;border-radius:13px;background:#ffffff08;color:#fff;font:inherit;cursor:pointer}.scrim{position:absolute;inset:0;z-index:19;background:#0008;opacity:0;pointer-events:none;transition:.25s}.scrim.show{opacity:1;pointer-events:auto}@media(max-width:600px){.app{border-radius:0}.bot{font-size:14px}.userRow{padding:0 10px}.user{max-width:92%;font-size:14px}.top{grid-template-columns:48px 1fr 48px}.drawer{width:min(340px,88vw)}.messages{bottom:144px}.composer{min-height:144px;padding:10px}.composerBox{min-height:116px;border-radius:23px}.composer textarea{height:116px;min-height:116px;padding:15px 96px 50px 15px}.composer button{right:8px;bottom:8px;height:40px;padding:0 15px}}
</style>
</head>
<body>
<div class="app" id="app">
<header class="top"><button id="menu" aria-label="বাম সাইডবার">☰</button><div><div class="title">গবেষণা সহকারী</div><div class="status" id="status">Cloudflare AI সংযোগ পরীক্ষা করা হচ্ছে…</div></div><button id="more" aria-label="ডান সাইডবার">⋮</button></header>
<div class="scrim" id="scrim"></div>
<aside class="drawer left" id="leftDrawer"><h3>আল-কুরআন রিচার্চ</h3><p>বাম সাইডবার — মূল গবেষণা সিস্টেম ও নেভিগেশন।</p><button>⌂ মূল পেজ</button><button>📖 কুরআন</button><button>🔎 গবেষণা</button><button>💬 গবেষণা সহকারী</button></aside>
<aside class="drawer right" id="rightDrawer"><h3>সিস্টেম</h3><p>ডান সাইডবার — চ্যাট ও সিস্টেমের বিকল্প।</p><button id="clear">🗑 চ্যাট পরিষ্কার</button><button id="stop">🔇 কথা বলা বন্ধ</button><button>⚙ গবেষণা মোড</button><button>ℹ সিস্টেম তথ্য</button></aside>
<main class="messages" id="messages"><div class="empty" id="empty">এই পেজটি ইচ্ছাকৃতভাবে খালি রাখা হয়েছে।<br>নিচে প্রশ্ন লিখে গবেষণা সহকারীর সঙ্গে কথা বলুন।</div></main>
<form class="composer" id="composer"><div class="composerBox"><textarea id="input" autocomplete="off" placeholder="আপনার প্রশ্ন লিখুন…"></textarea><button type="submit">পাঠান</button></div></form>
</div>
<script>
const WORKER_URL='https://al-quran-research.mosharrof0000.workers.dev/';
const left=document.getElementById('leftDrawer'),right=document.getElementById('rightDrawer'),scrim=document.getElementById('scrim'),menu=document.getElementById('menu'),more=document.getElementById('more'),messages=document.getElementById('messages'),empty=document.getElementById('empty'),input=document.getElementById('input'),composer=document.getElementById('composer'),status=document.getElementById('status');
const hues=[158,188,222,258,286,42];let hi=0;setInterval(()=>{hi=(hi+1)%hues.length;document.documentElement.style.setProperty('--h',hues[hi])},18000);
function resizeInput(){input.style.height='auto';const max=Math.round(window.innerHeight*.38);input.style.height=Math.min(Math.max(input.scrollHeight,116),max)+'px';const box=input.closest('.composerBox');box.style.minHeight=Math.min(Math.max(input.scrollHeight,116),max)+'px'}input.addEventListener('input',resizeInput);window.addEventListener('resize',resizeInput);
function closeDrawers(){left.classList.remove('open');right.classList.remove('open');scrim.classList.remove('show')};menu.onclick=()=>{right.classList.remove('open');left.classList.toggle('open');scrim.classList.toggle('show',left.classList.contains('open'))};more.onclick=()=>{left.classList.remove('open');right.classList.toggle('open');scrim.classList.toggle('show',right.classList.contains('open'))};scrim.onclick=closeDrawers;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawers()});
function add(text,who){if(empty)empty.remove();if(who==='user'){const row=document.createElement('div');row.className='userRow';const d=document.createElement('div');d.className='msg user';d.textContent=text;const actions=document.createElement('div');actions.className='actions';const copy=document.createElement('button');copy.type='button';copy.textContent='কপি';copy.onclick=async()=>{try{await navigator.clipboard.writeText(d.textContent);copy.textContent='কপি হয়েছে';setTimeout(()=>copy.textContent='কপি',1200)}catch(e){copy.textContent='কপি করা যায়নি';setTimeout(()=>copy.textContent='কপি',1200)}};const edit=document.createElement('button');edit.type='button';edit.textContent='এডিট';edit.onclick=()=>{input.value=d.textContent;resizeInput();input.focus();row.remove();};actions.append(copy,edit);row.append(d,actions);messages.appendChild(row)}else{const d=document.createElement('div');d.className='msg '+who;d.textContent=text;messages.appendChild(d)}messages.scrollTop=messages.scrollHeight}
async function askAI(q){const res=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q,mode:'general',language:'bn'})});const raw=await res.text();let data={};try{data=JSON.parse(raw)}catch(e){}if(!res.ok)throw new Error(data.detail||data.error||('Worker HTTP '+res.status));return data.answer||data.reply||data.text||'AI থেকে উত্তর পাওয়া যায়নি।'}
async function checkWorker(){try{const res=await fetch(WORKER_URL,{method:'GET'});status.textContent=res.ok?'Cloudflare Worker অনলাইন':'Worker HTTP '+res.status}catch(e){status.textContent='Worker সংযোগ পরীক্ষা ব্যর্থ'}}
composer.onsubmit=async e=>{e.preventDefault();const q=input.value.trim();if(!q)return;add(q,'user');input.value='';resizeInput();status.textContent='AI উত্তর তৈরি হচ্ছে…';try{add(await askAI(q),'bot');status.textContent='Cloudflare Worker সংযুক্ত'}catch(err){add('AI সংযোগে সমস্যা হয়েছে: '+err.message,'bot');status.textContent='সংযোগ পরীক্ষা প্রয়োজন'}};
document.getElementById('clear').onclick=()=>{messages.innerHTML='<div class="empty" id="empty">এই পেজটি ইচ্ছাকৃতভাবে খালি রাখা হয়েছে।<br>নিচে প্রশ্ন লিখে গবেষণা সহকারীর সঙ্গে কথা বলুন।</div>';closeDrawers()};document.getElementById('stop').onclick=()=>{speechSynthesis.cancel();closeDrawers()};checkWorker();resizeInput();
</script>
</body>
</html>

<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>আল-কুরআন গবেষণা — গবেষণা সহকারী v2.8</title>
<style>
:root{--h:158;--bg:hsl(var(--h) 55% 10%);--panel:hsl(var(--h) 38% 9%/.84);--line:#ffffff14;--composer:178px}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:"Noto Sans Bengali",system-ui,sans-serif}body{overflow:hidden;background:var(--bg);color:#fff;transition:background 8s}.app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 80% 10%,hsl(calc(var(--h)+45) 80% 70%/.12),transparent 25%),radial-gradient(circle at 10% 90%,hsl(calc(var(--h)+110) 70% 55%/.09),transparent 28%),var(--panel);backdrop-filter:blur(20px)}.top{height:64px;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:#ffffff08}.top button{width:42px;height:42px;border:0;border-radius:13px;background:#ffffff0b;color:#fff;font-size:22px}.title{text-align:center;font-weight:800;font-size:16px}.status{text-align:center;font-size:11px;opacity:.62;margin-top:2px}.modes{position:absolute;z-index:8;top:64px;left:0;right:0;height:50px;display:flex;gap:7px;overflow:auto;padding:7px 10px;background:#0004;border-bottom:1px solid var(--line);scrollbar-width:none}.modes::-webkit-scrollbar{display:none}.mode{white-space:nowrap;border:1px solid #ffffff18;background:#ffffff09;color:#fff;border-radius:18px;padding:7px 11px;font:inherit;font-size:12px}.mode.active{background:hsl(var(--h) 70% 42%/.8);border-color:hsl(var(--h) 80% 70%/.7)}.messages{position:absolute;top:114px;bottom:var(--composer);left:0;right:0;overflow:auto;padding:15px clamp(10px,3vw,28px) 24px;display:flex;flex-direction:column;gap:10px}.empty{margin:auto;opacity:.38;text-align:center;font-size:14px;line-height:1.7}.userRow{align-self:flex-end;width:100%;display:flex;flex-direction:column;align-items:flex-end}.user{max-width:min(820px,90vw);padding:11px 15px;border-radius:18px;background:hsl(var(--h) 45% 32%/.55);border:1px solid #ffffff14;white-space:pre-wrap;line-height:1.55}.botWrap{width:100%;max-width:900px;align-self:center}.bot{white-space:pre-wrap;line-height:1.6;font-size:15px;padding:8px 3px}.retry{border:1px solid #ffffff18;background:#ffffff09;color:#fff;border-radius:10px;padding:6px 10px;font:inherit;font-size:12px}.composer{position:absolute;left:0;right:0;bottom:0;min-height:var(--composer);display:flex;align-items:flex-end;padding:10px clamp(10px,2.5vw,28px) calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#0004}.box{position:relative;width:100%;min-height:150px;border:1px solid hsl(var(--h) 65% 65%/.42);border-radius:24px;background:linear-gradient(145deg,#ffffff12,#ffffff05 48%,hsl(var(--h) 55% 30%/.13));backdrop-filter:blur(16px);box-shadow:0 10px 34px #0007,0 0 24px hsl(var(--h) 85% 60%/.15);overflow:hidden}.box:before{content:"";position:absolute;inset:-45%;pointer-events:none;background:conic-gradient(from 0deg,transparent 0 28%,hsl(var(--h) 90% 70%/.18) 38%,transparent 48% 68%,hsl(calc(var(--h)+70) 90% 70%/.13) 78%,transparent 88%);animation:spin 9s linear infinite;filter:blur(22px)}@keyframes spin{to{transform:rotate(360deg)}}textarea{position:relative;z-index:2;display:block;width:100%;height:112px;min-height:112px;max-height:32vh;resize:none;border:0;background:transparent;color:#fff;padding:15px 118px 52px 16px;font:inherit;line-height:1.55;outline:none}textarea::placeholder{color:#ffffff70}.send{position:absolute;z-index:4;right:10px;bottom:10px;height:42px;border:0;border-radius:14px;background:hsl(var(--h) 70% 48%);color:#fff;padding:0 17px;font:inherit;font-weight:800}.tools{position:absolute;z-index:4;left:10px;bottom:10px;display:flex;gap:5px}.tool{height:42px;min-width:42px;border:1px solid #ffffff18;background:#ffffff0b;color:#fff;border-radius:12px;font-size:18px}.tool.active{background:hsl(var(--h) 60% 40%/.6)}.drawer{position:absolute;z-index:20;top:0;bottom:0;width:min(340px,88vw);padding:76px 20px 20px;background:hsl(var(--h) 34% 8%/.97);backdrop-filter:blur(24px);box-shadow:0 0 35px #0008;transition:transform .3s}.left{left:0;transform:translateX(-105%)}.right{right:0;transform:translateX(105%)}.drawer.open{transform:translateX(0)}.drawer h3{text-align:center;margin:0 0 18px}.drawer p{text-align:center;font-size:12px;opacity:.62;line-height:1.7}.drawer button{width:100%;margin:6px 0;padding:13px;border:0;border-radius:13px;background:#ffffff08;color:#fff;font:inherit}.scrim{position:absolute;inset:0;z-index:19;background:#0008;opacity:0;pointer-events:none;transition:.25s}.scrim.show{opacity:1;pointer-events:auto}@media(max-width:600px){.modes{height:46px}.messages{top:110px}.composer{min-height:166px;padding:8px}.box{min-height:146px}textarea{height:108px;min-height:108px;padding-right:110px}.send{right:8px;bottom:8px}.tools{left:8px;bottom:8px}.tool{height:40px;min-width:40px}}
</style></head>
<body><div class="app"><header class="top"><button id="menu">☰</button><div><div class="title">গবেষণা সহকারী</div><div class="status" id="status">বাংলা AI চ্যাট v2.8 প্রস্তুত</div></div><button id="more">⋮</button></header><div class="scrim" id="scrim"></div><aside class="drawer left" id="left"><h3>আল-কুরআন রিচার্চ</h3><p>গবেষণা সিস্টেম ও নেভিগেশন</p><button>⌂ মূল পেজ</button><button>📖 কুরআন</button><button>🔎 গবেষণা</button></aside><aside class="drawer right" id="right"><h3>সিস্টেম</h3><p>চ্যাট ও সিস্টেম নিয়ন্ত্রণ</p><button id="clear">🗑 চ্যাট পরিষ্কার</button><button id="stopDrawer">⏹ AI উত্তর থামান</button></aside><nav class="modes" id="modes"></nav><main class="messages" id="messages"><div class="empty" id="empty">গবেষণা মোড নির্বাচন করে প্রশ্ন লিখুন।<br>বাংলায় প্রশ্ন করুন।</div></main><form class="composer" id="composer"><div class="box"><textarea id="input" placeholder="আপনার প্রশ্ন লিখুন…" autocomplete="off"></textarea><div class="tools"><button class="tool" id="mic" type="button" title="বাংলায় কথা বলুন">🎤</button><button class="tool active" id="speaker" type="button" title="উত্তর শুনুন">🔊</button><button class="tool" id="stop" type="button" title="AI উত্তর থামান">⏹️</button></div><button class="send" type="submit">পাঠান</button></div></form></div>
<script>
const WORKERS=['https://al-quran-research.mosharroff0000.workers.dev/','https://al-quran-research.mosharrof0000.workers.dev/'];
const MODES=[['general','💬 সাধারণ প্রশ্ন'],['word','🔎 শব্দ গবেষণা'],['ayah','🧩 আয়াত বিশ্লেষণ'],['math','📊 গাণিতিক গবেষণা'],['concordance','🔗 একই শব্দ অনুসন্ধান'],['translation','📝 অনুবাদ গবেষণা']];
let mode='general',controller=null,lastQuestion='',speakerOn=true,recognition=null;
const $=id=>document.getElementById(id), input=$('input'),messages=$('messages'),status=$('status');
let hi=0;const hues=[158,188,222,258,286,42];setInterval(()=>{hi=(hi+1)%hues.length;document.documentElement.style.setProperty('--h',hues[hi])},18000);
MODES.forEach(([id,label])=>{const b=document.createElement('button');b.className='mode'+(id===mode?' active':'');b.textContent=label;b.onclick=()=>{mode=id;document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x===b));status.textContent='গবেষণা মোড: '+label};$('modes').appendChild(b)});
function resize(){input.style.height='auto';const h=Math.min(Math.max(input.scrollHeight,108),Math.round(innerHeight*.32));input.style.height=h+'px';document.documentElement.style.setProperty('--composer',(h+58)+'px')}input.addEventListener('input',resize);addEventListener('resize',resize);resize();
function add(text,who,retry){$('empty')?.remove();if(who==='user'){const r=document.createElement('div');r.className='userRow';const d=document.createElement('div');d.className='user';d.textContent=text;r.appendChild(d);messages.appendChild(r)}else{const w=document.createElement('div');w.className='botWrap';const d=document.createElement('div');d.className='bot';d.textContent=text;w.appendChild(d);if(retry){const b=document.createElement('button');b.className='retry';b.textContent='↻ আবার চেষ্টা';b.onclick=()=>send(lastQuestion);w.appendChild(b)}messages.appendChild(w);if(speakerOn)speak(text)}messages.scrollTop=messages.scrollHeight}
async function send(q){if(controller)return;const text=String(q??input.value??'').trim();if(!text)return;lastQuestion=text;input.value='';resize();add(text,'user');status.textContent='AI উত্তর তৈরি হচ্ছে…';controller=new AbortController();const timer=setTimeout(()=>controller.abort(),30000);let err=null;try{for(const url of WORKERS){try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,mode,language:'bn'}),signal:controller.signal});const raw=await r.text();let data={};try{data=JSON.parse(raw)}catch(e){}if(!r.ok)throw Error(data.detail||data.error||'Worker HTTP '+r.status);const answer=data.answer||data.reply||data.text;if(!answer)throw Error('উত্তর পাওয়া যায়নি');add(answer,'ai',false);status.textContent='বাংলা AI চ্যাট প্রস্তুত';return}catch(e){if(e.name==='AbortError')throw e;err=e}}throw err||Error('Worker unavailable')}catch(e){if(e.name==='AbortError'){add('AI উত্তর তৈরির কাজ থামানো হয়েছে। আবার চেষ্টা করতে পারেন।','ai',true);status.textContent='উত্তর থামানো হয়েছে'}else{add('AI সংযোগে সমস্যা হয়েছে। আবার চেষ্টা করুন।','ai',true);status.textContent='AI সংযোগে সমস্যা'}}finally{clearTimeout(timer);controller=null}}
function speak(t){if(!speakerOn||!speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='bn-BD';u.rate=.92;speechSynthesis.speak(u)}function stopSpeak(){if(speechSynthesis)speechSynthesis.cancel()}
$('speaker').onclick=()=>{speakerOn=!speakerOn;$('speaker').classList.toggle('active',speakerOn);$('speaker').textContent=speakerOn?'🔊':'🔇';if(!speakerOn)stopSpeak()};$('stop').onclick=()=>{if(controller)controller.abort();stopSpeak()};$('stopDrawer').onclick=()=>{if(controller)controller.abort();stopSpeak()};$('clear').onclick=()=>{messages.innerHTML='<div class="empty" id="empty">গবেষণা মোড নির্বাচন করে প্রশ্ন লিখুন।<br>বাংলায় প্রশ্ন করুন।</div>';lastQuestion='';stopSpeak();status.textContent='চ্যাট পরিষ্কার হয়েছে'};
$('mic').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){add('এই ব্রাউজারে বাংলা ভয়েস ইনপুট নেই। Chrome-এ চেষ্টা করুন।','ai');return}if(recognition){recognition.stop();recognition=null;$('mic').textContent='🎤';return}recognition=new SR();recognition.lang='bn-BD';recognition.interimResults=false;recognition.maxAlternatives=1;recognition.onresult=e=>{const t=e.results[0][0].transcript.trim();if(t){input.value=t;resize();send(t)}};recognition.onerror=()=>add('ভয়েস ইনপুটে সমস্যা হয়েছে। আবার 🎤 চাপুন।','ai');recognition.onend=()=>{recognition=null;$('mic').textContent='🎤'};$('mic').textContent='⏹️';recognition.start()};
$('composer').addEventListener('submit',e=>{e.preventDefault();send()});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
function drawer(which,open){which.classList.toggle('open',open);$('scrim').classList.toggle('show',open)}$('menu').onclick=()=>{drawer($('right'),false);drawer($('left'),true)};$('more').onclick=()=>{drawer($('left'),false);drawer($('right'),true)};$('scrim').onclick=()=>{drawer($('left'),false);drawer($('right'),false)};document.addEventListener('keydown',e=>{if(e.key==='Escape'){controller?.abort();stopSpeak();drawer($('left'),false);drawer($('right'),false)}});
</script></body></html>

<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>আল-কুরআন গবেষণা — চ্যাটবক্স রোবট ডেমো</title><style>:root{--h:158;--gold:hsl(calc(var(--h)+58) 78% 70%)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Noto Sans Bengali",system-ui,sans-serif}body{overflow:hidden;color:#fff;background:hsl(var(--h) 55% 12%)}.home{min-height:100svh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 42%,hsl(calc(var(--h)+25) 70% 42%/.2),transparent 27%),radial-gradient(circle at 12% 15%,hsl(calc(var(--h)+55) 80% 60%/.16),transparent 32%),linear-gradient(145deg,hsl(var(--h) 60% 11%),hsl(calc(var(--h)+38) 58% 19%),hsl(calc(var(--h)+82) 52% 13%))}.layer{position:absolute;border:1px solid #ffffff18;border-radius:50%;pointer-events:none}.l1{width:92vw;height:92vw;max-width:620px;max-height:620px;animation:spin 35s linear infinite}.l2{width:70vw;height:70vw;max-width:470px;max-height:470px;border-style:dashed;animation:spin 28s linear infinite reverse}.l3{width:48vw;height:48vw;max-width:320px;max-height:320px;animation:pulse 5s ease-in-out infinite}.content{position:relative;z-index:5;text-align:center;width:min(500px,90%);padding-top:12vh}.title{font-size:clamp(28px,8vw,46px);font-weight:900;margin:0 0 8px;text-shadow:0 5px 28px #0008}.sub{opacity:.72;margin:0 0 28px;font-size:13px}.buttons{display:grid;gap:14px}.choice{position:relative;overflow:hidden;border:1px solid #ffffff45;border-radius:24px;min-height:76px;color:#fff;font:inherit;font-size:19px;font-weight:900;cursor:pointer;backdrop-filter:blur(16px);box-shadow:0 18px 50px #0005;transition:transform .25s}.choice:active{transform:scale(.96)}.read{background:linear-gradient(110deg,hsl(calc(var(--h)+15) 72% 38%/.96),hsl(calc(var(--h)+65) 78% 47%/.9),hsl(calc(var(--h)+25) 75% 39%/.96));background-size:220% 100%;animation:shinebg 4s ease-in-out infinite}.research{background:#ffffff16}.button-inner{position:relative;z-index:3;display:inline-flex;align-items:center;justify-content:center;gap:8px}.button-robot{position:relative;width:54px;height:54px;flex:0 0 54px;transform:scale(.68);filter:drop-shadow(0 6px 8px #0007);pointer-events:none}.button-robot .head{position:absolute;left:3px;top:1px;width:42px;height:34px;border-radius:38% 38% 43% 43%;background:linear-gradient(145deg,#f7ffff,#b9dfe0);border:1px solid #ffffffaa}.button-robot .eye{position:absolute;top:10px;width:7px;height:9px;border-radius:50%;background:#102a38;box-shadow:inset 2px 1px 0 #fff;animation:miniLook 4s ease-in-out infinite,blink 6s infinite}.button-robot .eye.left{left:8px}.button-robot .eye.right{right:8px}.button-robot .mouth{position:absolute;left:17px;top:23px;width:8px;height:3px;border-bottom:1px solid #214b58;border-radius:50%}.button-robot .body{position:absolute;left:11px;top:35px;width:27px;height:19px;border-radius:8px 8px 11px 11px;background:linear-gradient(145deg,hsl(calc(var(--h)+25) 75% 56%),hsl(calc(var(--h)+60) 72% 45%));border:1px solid #ffffff66}.button-robot .antenna{position:absolute;left:23px;top:0;width:3px;height:9px;background:#bde5e2}.button-robot .antenna:after{content:"";position:absolute;left:-3px;top:-6px;width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold);animation:glow 1.2s infinite}.button-robot .arm{position:absolute;top:38px;width:6px;height:13px;border-radius:6px;background:#c5e6e5}.button-robot .arm.left{left:2px;animation:armL .8s infinite alternate}.button-robot .arm.right{right:2px;animation:armR .9s infinite alternate}.button-robot.reacted{animation:react .7s ease-in-out 2}.robot{position:fixed;z-index:20;width:126px;height:146px;left:50%;top:21%;touch-action:none;cursor:grab;user-select:none;filter:drop-shadow(0 18px 28px #0007);animation:bob 3.2s ease-in-out infinite}.robot:active{cursor:grabbing}.robot .head{position:absolute;left:10px;top:10px;width:106px;height:88px;border-radius:38% 38% 43% 43%;background:linear-gradient(145deg,#f7ffff,#b9dfe0);border:3px solid #ffffffaa;box-shadow:inset 0 -10px 18px #277a7a33,0 0 30px hsl(var(--h) 80% 65%/.35);animation:headMove 7s ease-in-out infinite}.robot .eye{position:absolute;top:30px;width:19px;height:27px;border-radius:50%;background:#102a38;box-shadow:inset 5px 4px 0 #fff;animation:look 5s ease-in-out infinite,blink 6s infinite}.robot .eye.left{left:24px}.robot .eye.right{right:24px}.robot .mouth{position:absolute;left:43px;top:61px;width:20px;height:10px;border-bottom:3px solid #214b58;border-radius:50%;animation:happy 4s ease-in-out infinite}.robot .body{position:absolute;left:28px;top:91px;width:70px;height:53px;border-radius:22px 22px 28px 28px;background:linear-gradient(145deg,hsl(calc(var(--h)+25) 75% 56%),hsl(calc(var(--h)+60) 72% 45%));border:2px solid #ffffff66}.robot .antenna{position:absolute;left:59px;top:-4px;width:8px;height:19px;background:#bde5e2;z-index:2}.robot .antenna:after{content:"";position:absolute;left:-4px;top:-10px;width:16px;height:16px;border-radius:50%;background:var(--gold);box-shadow:0 0 20px var(--gold);animation:glow 1.5s infinite}.robot .arm{position:absolute;top:101px;width:20px;height:45px;border-radius:15px;background:#c5e6e5;transform-origin:top center}.robot .arm.left{left:13px;transform:rotate(18deg);animation:wave 2.8s infinite}.robot .arm.right{right:13px;transform:rotate(-18deg);animation:waveR 3.1s infinite}.robot .heart{position:absolute;left:25px;top:8px;font-size:13px;animation:heart 1.6s infinite}.chat{position:fixed;z-index:50;left:50%;bottom:18px;transform:translate(-50%,120%);width:min(520px,92%);background:#0b1725eF;border:1px solid #ffffff35;border-radius:22px;padding:14px;box-shadow:0 20px 60px #0009;backdrop-filter:blur(18px);transition:transform .45s ease}.chat.open{transform:translate(-50%,0)}.chat-title{font-weight:900;margin-bottom:8px}.chat-row{display:flex;gap:8px}.chat input{min-width:0;flex:1;border:1px solid #ffffff35;border-radius:14px;background:#ffffff12;color:#fff;padding:12px;font:inherit;outline:none}.chat button{border:0;border-radius:14px;padding:0 16px;background:#ffffff20;color:#fff;font:inherit;font-weight:900}.chat-answer{min-height:20px;font-size:13px;opacity:.85;margin-top:9px}.hint{font-size:10px;opacity:.5;margin-top:12px}@keyframes bob{50%{margin-top:-9px}}@keyframes headMove{0%,35%,100%{transform:rotate(0)}45%{transform:rotate(-5deg)}55%{transform:rotate(5deg)}65%{transform:rotate(-2deg)}}@keyframes look{0%,20%{transform:translateX(-4px)}35%,65%{transform:translateX(5px)}80%,100%{transform:translateX(-2px)}}@keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%,47%{transform:scaleY(.08)}}@keyframes happy{50%{width:27px;height:14px;left:39px}}@keyframes wave{50%{transform:rotate(34deg)}80%{transform:rotate(5deg)}}@keyframes waveR{50%{transform:rotate(-34deg)}80%{transform:rotate(-8deg)}}@keyframes glow{50%{opacity:.45;transform:scale(.72)}}@keyframes heart{50%{transform:scale(1.3) rotate(8deg)}}@keyframes shinebg{50%{background-position:100% 0}}@keyframes pulse{50%{transform:scale(1.06);opacity:.7}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes miniLook{0%,25%{transform:translateX(-2px)}45%,70%{transform:translateX(2px)}85%,100%{transform:translateX(0)}}@keyframes armL{to{transform:rotate(25deg)}}@keyframes armR{to{transform:rotate(-25deg)}}@keyframes react{0%,100%{transform:scale(.68) rotate(0)}35%{transform:scale(.95) rotate(-10deg)}70%{transform:scale(.78) rotate(10deg)}}@media(max-width:430px){.content{padding-top:14vh}.choice{min-height:70px}.title{font-size:30px}.robot{top:19%;transform:scale(.9);transform-origin:top center}}
</style></head><body><main class="home"><div class="layer l1"></div><div class="layer l2"></div><div class="layer l3"></div><div class="robot" id="robot" aria-label="চ্যাটবক্স AI রোবট"><div class="antenna"></div><div class="head"><div class="eye left"></div><div class="eye right"></div><div class="mouth"></div></div><div class="body"><span class="heart">✦</span></div><div class="arm left"></div><div class="arm right"></div></div><section class="content"><h1 class="title">আল-কুরআন গবেষণা</h1><p class="sub">পড়ুন, বুঝুন এবং ভাষাভিত্তিক গবেষণার পথে এগিয়ে যান</p><div class="buttons"><button class="choice read" onclick="choose('readRobot','কোরআন পড়ুন')"><span class="button-inner"><span class="button-robot" id="readRobot"><span class="antenna"></span><span class="head"><span class="eye left"></span><span class="eye right"></span><span class="mouth"></span></span><span class="body"></span><span class="arm left"></span><span class="arm right"></span></span><span>📖</span><span>কোরআন পড়ুন</span></span></button><button class="choice research" onclick="choose('researchRobot','গবেষণা করুন')"><span class="button-inner"><span class="button-robot" id="researchRobot"><span class="antenna"></span><span class="head"><span class="eye left"></span><span class="eye right"></span><span class="mouth"></span></span><span class="body"></span><span class="arm left"></span><span class="arm right"></span></span><span>🔎</span><span>গবেষণা করুন</span></span></button></div><div class="hint">ছোট রোবটে টাচ করলে চ্যাটবক্স খুলবে</div></section></main><section class="chat" id="chat"><div class="chat-title">🤖 রোবটের সাথে কথা বলুন</div><div class="chat-row"><input id="msg" placeholder="আপনার প্রশ্ন লিখুন…"><button onclick="sendMsg()">পাঠান</button></div><div class="chat-answer" id="answer">আমি শুনছি…</div></section><script>const big=document.getElementById('robot');const chat=document.getElementById('chat');const msg=document.getElementById('msg');const answer=document.getElementById('answer');let drag=false,dx=0,dy=0;big.addEventListener('pointerdown',e=>{drag=true;big.setPointerCapture(e.pointerId);const q=big.getBoundingClientRect();dx=e.clientX-q.left;dy=e.clientY-q.top;big.style.animation='none'});big.addEventListener('pointermove',e=>{if(!drag)return;big.style.left=(e.clientX-dx)+'px';big.style.top=(e.clientY-dy)+'px';big.style.transform='none'});big.addEventListener('pointerup',()=>{drag=false;big.style.animation='bob 3.2s ease-in-out infinite'});function choose(id,label){const x=document.getElementById(id);x.classList.remove('reacted');void x.offsetWidth;x.classList.add('reacted');big.style.transform='scale(1.18)';chat.classList.add('open');answer.textContent='আপনি “'+label+'” বেছে নিয়েছেন। এখন আমাকে প্রশ্ন করতে পারেন।';setTimeout(()=>msg.focus(),350)}function sendMsg(){const t=msg.value.trim();if(!t)return;answer.textContent='আপনার প্রশ্ন গ্রহণ করেছি: '+t;msg.value='';}msg.addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg()});const hues=[158,188,222,258,286,42];let i=0;setInterval(()=>{i=(i+1)%hues.length;document.documentElement.style.setProperty('--h',hues[i])},18000)</script></body></html>

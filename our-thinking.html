<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>আমাদের চিন্তা ও ভবিষ্যৎ পরিকল্পনা</title><style>:root{--bg:#071d1d;--green:#0d4b3e;--gold:#cda84a;--gold2:#f2d786;--cream:#f7f2e8}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Noto Sans Bengali",system-ui,sans-serif;background:radial-gradient(circle at 50% 0,#123f3c,#071d1d 52%,#041314);color:var(--cream)}.app{max-width:760px;margin:auto;padding:14px;min-height:100vh}.topbar{height:68px;display:flex;align-items:center;border-bottom:1px solid #cda84a55;margin-bottom:15px}.back{font-size:31px;color:#ead67d;text-decoration:none;padding:5px 12px 5px 2px}.title{text-align:center;flex:1}.title b{display:block;font-size:23px}.title span{font-size:12px;color:#d8d0c4}.hero{border:2px solid #dfb955b3;border-radius:24px;padding:24px 18px;text-align:center;background:radial-gradient(circle at 50% 20%,#124a43,#071e1e 72%);box-shadow:0 0 35px #0008}.logo{margin:auto;width:65px;height:65px;border:2px solid var(--gold2);border-radius:50%;display:grid;place-items:center;background:#0b302d;font-size:27px}.hero h1{font-size:30px;margin:14px 0 6px}.hero p{margin:0;color:#d8d1c5;line-height:1.8;font-size:14px}.grid{display:grid;gap:12px;margin-top:16px}.card{width:100%;border:1px solid #d6c38a;background:linear-gradient(135deg,#f8f5f0,#eee8e1);color:#28272a;border-radius:20px;padding:17px;text-align:right;box-shadow:0 7px 18px #0005;cursor:pointer;transition:.18s}.card:active{transform:scale(.985)}.card-top{display:flex;align-items:center;gap:13px}.icon{width:52px;height:52px;border-radius:15px;background:#eee2bd;display:grid;place-items:center;font-size:29px;flex:none}.card h2{margin:0;color:#315c51;font-size:19px}.card small{display:block;color:#756b5d;margin-top:3px}.arrow{margin-left:auto;font-size:30px;color:#9b7b20}.details{display:none;margin-top:14px;border-top:1px solid #ddd2bf;padding-top:12px;line-height:1.85;font-size:14px}.card.open .details{display:block}.details ul{margin:7px 0;padding-left:20px}.voice{display:grid;gap:7px;margin-top:8px}.cmd{background:#fff;border:1px solid #ddd6c8;border-radius:11px;padding:9px}.flow{background:#0d4b3e;color:#fff;border:1px solid #cda84a66;border-radius:12px;padding:11px;text-align:center}.footer{text-align:center;color:#bdb5a7;font-size:12px;line-height:1.8;margin:18px 4px}</style></head><body><main class="app"><header class="topbar"><a class="back" href="index.html">‹</a><div class="title"><b>আমাদের চিন্তা</b><span>দর্শন ও ভবিষ্যৎ পরিকল্পনা</span></div><div style="width:43px"></div></header><section class="hero"><div class="logo">ﷲ</div><h1>আমাদের গবেষণা-সঙ্গী</h1><p>একটি বিষয় চাপুন—বিস্তারিত খুলবে।</p></section><section class="grid"><button class="card" onclick="toggle(this)"><div class="card-top"><div class="icon">🎙️</div><div><h2>সহজ ব্যবহার</h2><small>কথা বলেই নিয়ন্ত্রণ</small></div><span class="arrow">›</span></div><div class="details"><p>প্রযুক্তি না-জানা মানুষও স্বাভাবিক ভাষায় নির্দেশ দিতে পারবেন।</p><div class="voice"><div class="cmd">“আরও দ্রুত পড়ো।” — গতি বাড়াবে</div><div class="cmd">“আস্তে পড়ো।” — গতি কমাবে</div><div class="cmd">“থামো।” — পড়া থামাবে</div><div class="cmd">“আবার পড়ো।” — আবার পড়বে</div><div class="cmd">“এই শব্দটার মানে কী?” — গবেষণায় নেবে</div><div class="cmd">“এটা আমার গবেষণায় রাখো।” — সংরক্ষণ করবে</div></div></div></button><button class="card" onclick="toggle(this)"><div class="card-top"><div class="icon">🤖</div><div><h2>গবেষণা-সঙ্গী</h2><small>যেখানে থেমেছিলেন সেখান থেকেই</small></div><span class="arrow">›</span></div><div class="details"><ul><li>কোথায় গবেষণা থেমেছিল</li><li>কী প্রশ্ন ছিল</li><li>কী নোট ও সংগ্রহ আছে</li><li>কোন বিষয় অসম্পূর্ণ</li><li>পরেরবার কোথা থেকে শুরু করা উচিত</li></ul><p>ব্যবহারকারীর অনুমতি থাকলেই স্মৃতি ও স্মরণ ব্যবস্থা কাজ করবে।</p></div></button><button class="card" onclick="toggle(this)"><div class="card-top"><div class="icon">📚</div><div><h2>আমার গবেষণা</h2><small>প্রত্যেক গবেষকের নিজের জায়গা</small></div><span class="arrow">›</span></div><div class="details"><p>আমার প্রশ্ন · আমার নোট · আমার সংগ্রহ · গবেষণার ইতিহাস · সংরক্ষিত আয়াত/শব্দ · গবেষণার ফলাফল · অসম্পূর্ণ গবেষণা · ভবিষ্যতে দেখব।</p></div></button><button class="card" onclick="toggle(this)"><div class="card-top"><div class="icon">👥</div><div><h2>বহু গবেষক</h2><small>একই বিষয়, বহু স্বাধীন পথ</small></div><span class="arrow">›</span></div><div class="details"><p>একই আয়াত, শব্দ বা প্রশ্ন নিয়ে একাধিক মানুষ স্বাধীনভাবে গবেষণা করতে পারবেন। ভিন্ন ফলাফল, মত বা অনিশ্চয়তা মুছে যাবে না।</p></div></button><button class="card" onclick="toggle(this)"><div class="card-top"><div class="icon">🔒</div><div><h2>গবেষণার নিরাপত্তা</h2><small>ইতিহাস হারাবে না</small></div><span class="arrow">›</span></div><div class="details"><ul><li>Raw data overwrite নয়</li><li>সংশোধন হলে নতুন version/proposal</li><li>AI-এর তথ্য নিজে থেকেই verified নয়</li><li>দাবির সঙ্গে প্রমাণের পথ থাকবে</li><li>অনিশ্চয়তা ও মতভেদ গোপন করা হবে না</li><li>AI মূল গবেষণা-তথ্য নিজে থেকে বদলাবে বা মুছবে না</li></ul></div></button><button class="card" onclick="toggle(this)"><div class="card-top"><div class="icon">🔌</div><div><h2>AI স্বাধীনতা</h2><small>কোনো এক AI-এর ওপর নির্ভর নয়</small></div><span class="arrow">›</span></div><div class="details"><div class="flow">গবেষক → গবেষণা ব্যবস্থা → AI Bridge → প্রয়োজনের AI</div><p>ChatGPT, Gemini, ভবিষ্যতের AI বা স্থানীয়/open model প্রয়োজন অনুযায়ী যুক্ত হতে পারবে। AI হবে সহায়ক, প্রকল্পের মালিক নয়।</p></div></button><button class="card" onclick="toggle(this)"><div class="card-top"><div class="icon">👁️</div><div><h2>সজাগ গবেষণা-সঙ্গী</h2><small>নতুন প্রযুক্তি আগে পরীক্ষা</small></div><span class="arrow">›</span></div><div class="details"><p>নতুন AI, ভয়েস, গবেষণা-সরঞ্জাম ও সংরক্ষণ প্রযুক্তি নজরে রাখা হবে। আগে পরীক্ষা ও মূল্যায়ন, তারপর উপকারী হলে প্রস্তাব। জোর করে আপডেট নয়।</p></div></button><button class="card" onclick="toggle(this)"><div class="card-top"><div class="icon">🌱</div><div><h2>দীর্ঘমেয়াদি উত্তরাধিকার</h2><small>আজকের চিন্তা যেন হারিয়ে না যায়</small></div><span class="arrow">›</span></div><div class="details"><p>ভবিষ্যতের গবেষক যেন বুঝতে পারেন—গবেষণা কোথা থেকে শুরু হয়েছিল, কেন প্রশ্নটি করা হয়েছিল, কীভাবে চিন্তা এগিয়েছিল, কোথায় ভুল/সংশোধন হয়েছে এবং কোথা থেকে আবার কাজ শুরু করা যায়।</p></div></button></section><div class="footer">প্রতিটি বাটনে চাপ দিলে বিস্তারিত খুলবে।<br>মূল গবেষণা ডেটাবেস পরিবর্তন করা হয়নি।</div></main><script>function toggle(el){document.querySelectorAll('.card.open').forEach(c=>{if(c!==el)c.classList.remove('open')});el.classList.toggle('open')}</script></body></html>

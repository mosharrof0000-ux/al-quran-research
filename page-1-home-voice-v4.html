<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>আল-কুরআন গবেষণা — হোম পেজ v4</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08151b}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="home" src="design-preview-page1-chatbox-robot-demo.html" title="আল-কুরআন গবেষণা হোম পেজ"></iframe><script>const frame=document.getElementById('home');frame.addEventListener('load',()=>{try{const doc=frame.contentDocument,win=doc.defaultView;const big=doc.getElementById('robot'),read=doc.getElementById('readRobot'),research=doc.getElementById('researchRobot'),buttons=doc.querySelectorAll('.choice'),chat=doc.getElementById('chat'),toggle=win.toggleChat;if(chat)chat.style.display='';if(big){big.onclick=null;big.addEventListener('pointerup',e=>{e.preventDefault();e.stopImmediatePropagation()},true);big.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();big.classList.remove('reacted');void big.offsetWidth;big.classList.add('reacted');startVoice()},true)}function smallVoice(r,label){if(!r)return;r.onclick=null;r.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();r.classList.remove('reacted');void r.offsetWidth;r.classList.add('reacted');if(typeof toggle==='function')toggle(label)},true)}smallVoice(read,'কোরআন রোবট');smallVoice(research,'গবেষণা রোবট');if(buttons.length>=2){buttons[0].onclick=null;buttons[1].onclick=null;buttons[0].addEventListener('click',e=>{if(e.target===read||read.contains(e.target))return;e.preventDefault();e.stopImmediatePropagation()},true);buttons[1].addEventListener('click',e=>{if(e.target===research||research.contains(e.target))return;e.preventDefault();e.stopImmediatePropagation();setTimeout(()=>{location.href='page-2-research-lab.html'},700)},true)}const hint=doc.querySelector('.hint');if(hint)hint.textContent='ছোট রোবটে টাচ করলে চ্যাটবক্স খুলবে • বড় রোবটের সাথে সরাসরি কথা বলুন';let voiceStatus=null;function makeVoiceStatus(){if(voiceStatus)return;voiceStatus=doc.createElement('div');voiceStatus.textContent='🎙️ বড় রোবট শুনছে…';voiceStatus.style.cssText='position:fixed;z-index:60;left:50%;top:66%;transform:translateX(-50%);padding:10px 16px;border:1px solid #ffffff35;border-radius:18px;background:#0b1725dd;color:#fff;font-size:14px;font-weight:700;backdrop-filter:blur(12px);box-shadow:0 12px 30px #0007';doc.body.appendChild(voiceStatus)}function speak(text){if(win.speechSynthesis&&win.SpeechSynthesisUtterance){win.speechSynthesis.cancel();const u=new win.SpeechSynthesisUtterance(text);u.lang='bn-BD';u.rate=.95;win.speechSynthesis.speak(u)}}function startVoice(){makeVoiceStatus();voiceStatus.textContent='🎙️ বলুন…';const SR=win.SpeechRecognition||win.webkitSpeechRecognition;if(!SR){voiceStatus.textContent='🎙️ আপনার ব্রাউজারে ভয়েস কথা বলা চালু নেই';speak('আপনার ব্রাউজারে ভয়েস কথা বলা চালু নেই।');setTimeout(()=>voiceStatus.remove(),2600);voiceStatus=null;return}const rec=new SR();rec.lang='bn-BD';rec.interimResults=false;rec.maxAlternatives=1;rec.onresult=e=>{const text=e.results[0][0].transcript;voiceStatus.textContent='🤖 শুনেছি: '+text;speak('আপনি বলেছেন, '+text+'। আমি শুনেছি।');setTimeout(()=>{if(voiceStatus){voiceStatus.remove();voiceStatus=null}},3200)};rec.onerror=()=>{voiceStatus.textContent='🎙️ আবার চেষ্টা করুন';setTimeout(()=>{if(voiceStatus){voiceStatus.remove();voiceStatus=null}},1800)};rec.onend=()=>{};try{rec.start()}catch(e){voiceStatus.textContent='🎙️ আবার টাচ করে কথা বলুন'}}}catch(e){console.error('হোম পেজ v4 সংযোগ স্থাপন করা যায়নি',e)}});</script></body></html>

<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>আল-কুরআন গবেষণা — সুফি অ্যাম্বিয়েন্ট ডেমো</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;color:#fff}body{background:#061812;transition:background 3s ease}.ambient{position:fixed;inset:-20%;background:radial-gradient(circle at 50% 42%,rgba(31,170,125,.28),transparent 28%),radial-gradient(circle at 15% 85%,rgba(46,91,210,.20),transparent 30%),radial-gradient(circle at 88% 15%,rgba(147,70,220,.16),transparent 28%),radial-gradient(circle at 55% 110%,rgba(218,173,54,.15),transparent 26%);filter:blur(18px);animation:drift 16s ease-in-out infinite alternate;pointer-events:none}.stars{position:fixed;inset:0;opacity:.45;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:72px 72px;mask-image:linear-gradient(to bottom,black,transparent 90%);pointer-events:none}.moon{position:absolute;top:8%;right:9%;width:70px;height:70px;border-radius:50%;background:#f4e6ae;box-shadow:0 0 35px rgba(255,239,174,.35)}.moon:after{content:"";position:absolute;left:22px;top:-5px;width:70px;height:70px;border-radius:50%;background:#081b16}.wrap{position:relative;z-index:2;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}.eyebrow{font-size:13px;letter-spacing:4px;opacity:.65;margin-bottom:12px}.title{font-size:clamp(34px,7vw,72px);margin:0;font-weight:700;text-shadow:0 0 28px rgba(94,225,184,.2)}.sub{max-width:700px;margin:14px auto 30px;line-height:1.8;opacity:.78;font-size:clamp(14px,2.2vw,19px)}.core{position:relative;width:210px;height:210px;margin:5px auto 30px}.ring{position:absolute;inset:4px;border:1px solid rgba(255,221,120,.35);border-radius:50%;box-shadow:0 0 45px rgba(76,213,167,.16);animation:spin 18s linear infinite}.ring:before,.ring:after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:#f4d77a;box-shadow:0 0 15px #f4d77a}.ring:before{top:-3px;left:50%}.ring:after{bottom:18px;right:8px}.robot{position:absolute;left:50%;top:50%;transform:translate(-50%,-48%);width:118px;height:105px;animation:float 3.8s ease-in-out infinite}.antenna{position:absolute;left:50%;top:-28px;width:3px;height:27px;background:#8be6ca;transform:translateX(-50%)}.antenna:after{content:"";position:absolute;top:-8px;left:-5px;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff,0 0 22px #4fe1b4,0 0 42px rgba(79,225,180,.8)}.head{position:absolute;inset:0 0 25px;border-radius:34px;background:linear-gradient(145deg,#183e34,#0b201a);border:1px solid rgba(126,239,207,.45);box-shadow:inset 0 0 25px rgba(68,220,170,.08),0 12px 35px rgba(0,0,0,.35)}.eye{position:absolute;top:38px;width:20px;height:25px;border-radius:50%;background:#dfffee;box-shadow:0 0 15px #72e6bd}.eye.left{left:27px}.eye.right{right:27px}.body{position:absolute;left:17px;right:17px;bottom:0;height:44px;border-radius:18px;background:linear-gradient(180deg,#164b3c,#0b211b);border:1px solid rgba(126,239,207,.35)}.arm{position:absolute;top:66px;width:27px;height:9px;border-radius:9px;background:#236b55}.arm.l{left:-4px;transform:rotate(24deg);animation:wave 2.8s ease-in-out infinite}.arm.r{right:-4px;transform:rotate(-24deg);animation:wave 2.8s ease-in-out infinite reverse}.actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}.btn{border:1px solid rgba(255,226,133,.45);background:rgba(255,255,255,.07);color:#fff;padding:14px 24px;border-radius:18px;backdrop-filter:blur(14px);cursor:pointer;font-size:16px;transition:.35s;box-shadow:0 8px 30px rgba(0,0,0,.16)}.btn:hover{transform:translateY(-3px) scale(1.03);background:rgba(255,255,255,.12);box-shadow:0 0 30px rgba(96,220,180,.16)}.status{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);font-size:12px;opacity:.55;white-space:nowrap}.voice{position:fixed;top:18px;left:18px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.18);padding:9px 13px;border-radius:99px;font-size:12px;backdrop-filter:blur(10px)}@keyframes float{50%{transform:translate(-50%,-55%)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes drift{to{transform:translate(5%, -3%) scale(1.08)}}@keyframes wave{50%{transform:rotate(-12deg) translateY(-3px)}}@media(max-width:600px){.moon{width:48px;height:48px;right:7%;top:6%}.moon:after{width:48px;height:48px;left:15px;top:-4px}.core{width:175px;height:175px}.robot{transform:translate(-50%,-48%) scale(.86)}.sub{margin-bottom:20px}.btn{padding:12px 18px}}
</style></head>
<body>
<div class="ambient"></div><div class="stars"></div><div class="moon"></div><div class="voice">◉ ভয়েস + অ্যাম্বিয়েন্ট ইন্টার‌অ্যাকশন</div>
<main class="wrap"><div class="eyebrow">RESEARCH • KNOWLEDGE • DISCOVERY</div><h1 class="title">আল-কুরআন</h1><p class="sub">পড়ুন, বুঝুন এবং গবেষণা করুন — শান্ত, গভীর ও অনুসন্ধানী একটি আধুনিক জ্ঞানভ্রমণ।</p>
<div class="core"><div class="ring"></div><div class="robot"><div class="antenna"></div><div class="head"><span class="eye left"></span><span class="eye right"></span></div><div class="body"></div><div class="arm l"></div><div class="arm r"></div></div></div>
<div class="actions"><button class="btn" onclick="demo('কুরআন পড়ুন')">📖 কুরআন পড়ুন</button><button class="btn" onclick="demo('গবেষণা করুন')">⌕ গবেষণা করুন</button><button class="btn" onclick="voice()">🎙️ রোবটের সাথে কথা বলুন</button></div></main><div class="status" id="status">এটি নতুন ডিজাইন ধারণার ডেমো — পুরোনো কোনো লকড পেজ পরিবর্তন করা হয়নি।</div>
<script>function demo(x){document.getElementById('status').textContent=x+' — এই ডেমোতে এখন শুধু ইন্টার‌অ্যাকশন দেখানো হচ্ছে।'}function voice(){document.getElementById('status').textContent='রোবট শুনছে… (ভয়েস ইন্টার‌অ্যাকশন পরের ধাপে সংযুক্ত করা যাবে)';if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance('আমি শুনছি। আপনি কী গবেষণা করতে চান?');u.lang='bn-BD';speechSynthesis.speak(u)}}</script></body></html>

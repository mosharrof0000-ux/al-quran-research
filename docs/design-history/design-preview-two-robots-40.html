<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>রোবট কাজের পেজ — দুই রোবট</title><style>:root{--h:158;--gold:hsl(calc(var(--h)+58) 78% 70%)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Noto Sans Bengali",system-ui,sans-serif}body{overflow:hidden;background:hsl(var(--h) 55% 12%);transition:background 8s}.home{min-height:100svh;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 42%,hsl(calc(var(--h)+25) 70% 42%/.2),transparent 27%),radial-gradient(circle at 12% 15%,hsl(calc(var(--h)+55) 80% 60%/.16),transparent 32%),linear-gradient(145deg,hsl(var(--h) 60% 11%),hsl(calc(var(--h)+38) 58% 19%),hsl(calc(var(--h)+82) 52% 13%));transition:background 8s}.layer{position:absolute;border:1px solid #ffffff18;border-radius:50%;pointer-events:none}.l1{width:92vw;height:92vw;max-width:620px;max-height:620px;box-shadow:0 0 90px hsl(var(--h) 80% 60%/.12);animation:spin 35s linear infinite}.l2{width:70vw;height:70vw;max-width:470px;max-height:470px;border-style:dashed;animation:spin 28s linear infinite reverse}.l3{width:48vw;height:48vw;max-width:320px;max-height:320px;box-shadow:inset 0 0 45px hsl(calc(var(--h)+55) 80% 70%/.1);animation:pulse 5s ease-in-out infinite}.robot{position:fixed;z-index:20;width:126px;height:150px;left:50%;top:22%;touch-action:none;cursor:grab;user-select:none;filter:drop-shadow(0 18px 28px #0007);animation:bob 3.2s ease-in-out infinite}.robot:active{cursor:grabbing}.robot-small{position:fixed;z-index:20;width:126px;height:150px;left:calc(50% + 92px);top:29%;touch-action:none;cursor:default;user-select:none;filter:drop-shadow(0 18px 28px #0007);transform:scale(.4);transform-origin:top left;animation:bob-small 3.2s ease-in-out infinite}.head{position:absolute;left:10px;top:10px;width:106px;height:88px;border-radius:38% 38% 43% 43%;background:linear-gradient(145deg,#f7ffff,#b9dfe0);border:3px solid #ffffffaa;box-shadow:inset 0 -10px 18px #277a7a33,0 0 30px hsl(var(--h) 80% 65%/.35)}.eye{position:absolute;top:30px;width:19px;height:27px;border-radius:50%;background:#102a38;box-shadow:inset 5px 4px 0 #fff;animation:look 5s ease-in-out infinite,blink 6s infinite}.eye.left{left:24px}.eye.right{right:24px}.mouth{position:absolute;left:43px;top:61px;width:20px;height:10px;border-bottom:3px solid #214b58;border-radius:50%;animation:happy 4s ease-in-out infinite}.body{position:absolute;left:28px;top:91px;width:70px;height:53px;border-radius:22px 22px 28px 28px;background:linear-gradient(145deg,hsl(calc(var(--h)+25) 75% 56%),hsl(calc(var(--h)+60) 72% 45%));border:2px solid #ffffff66;box-shadow:0 0 22px hsl(var(--h) 80% 60%/.22)}.antenna{position:absolute;left:59px;top:-4px;width:8px;height:19px;background:#bde5e2}.antenna:after{content:"";position:absolute;left:-4px;top:-10px;width:16px;height:16px;border-radius:50%;background:var(--gold);box-shadow:0 0 20px var(--gold);animation:glow 1.5s infinite}.arm{position:absolute;top:101px;width:20px;height:45px;border-radius:15px;background:#c5e6e5}.arm.left{left:13px;transform:rotate(18deg);animation:wave 2.8s infinite}.arm.right{right:13px;transform:rotate(-18deg)}.heart{position:absolute;left:25px;top:8px;font-size:13px;animation:heart 1.6s infinite}@keyframes bob{50%{margin-top:-9px}}@keyframes bob-small{50%{margin-top:-4px}}@keyframes look{0%,20%{transform:translateX(-4px)}35%,65%{transform:translateX(5px)}80%,100%{transform:translateX(-2px)}}@keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%,47%{transform:scaleY(.08)}}@keyframes happy{50%{width:27px;height:14px;left:39px}}@keyframes wave{50%{transform:rotate(34deg)}}@keyframes glow{50%{opacity:.45;transform:scale(.72)}}@keyframes heart{50%{transform:scale(1.3) rotate(8deg)}}@keyframes pulse{50%{transform:scale(1.06);opacity:.7}}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:430px){.robot{transform:scale(.9);transform-origin:center}.robot-small{transform:scale(.4);transform-origin:top left}}</style></head><body><main class="home"><div class="layer l1"></div><div class="layer l2"></div><div class="layer l3"></div><div class="robot" id="robot" aria-label="চঞ্চল AI রোবট"><div class="antenna"></div><div class="head"><div class="eye left"></div><div class="eye right"></div><div class="mouth"></div></div><div class="body"><span class="heart">✦</span></div><div class="arm left"></div><div class="arm right"></div></div><div class="robot-small" id="robot-small" aria-label="ছোট চঞ্চল AI রোবট"><div class="antenna"></div><div class="head"><div class="eye left"></div><div class="eye right"></div><div class="mouth"></div></div><div class="body"><span class="heart">✦</span></div><div class="arm left"></div><div class="arm right"></div></div></main><script>const r=document.getElementById('robot');let drag=false,dx=0,dy=0;r.addEventListener('pointerdown',e=>{drag=true;r.setPointerCapture(e.pointerId);const q=r.getBoundingClientRect();dx=e.clientX-q.left;dy=e.clientY-q.top;r.style.animation='none'});r.addEventListener('pointermove',e=>{if(!drag)return;r.style.left=(e.clientX-dx)+'px';r.style.top=(e.clientY-dy)+'px';r.style.transform='none'});r.addEventListener('pointerup',()=>{drag=false;r.style.animation='bob 3.2s ease-in-out infinite'});const hues=[158,188,222,258,286,42];let i=0;setInterval(()=>{i=(i+1)%hues.length;document.documentElement.style.setProperty('--h',hues[i])},18000)</script></body></html>

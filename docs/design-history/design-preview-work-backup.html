<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>আল-কুরআন গবেষণা — কাজের ডেমো ব্যাকআপ</title><style>:root{--h:158;--a:hsl(var(--h) 65% 42%);--b:hsl(calc(var(--h)+42) 70% 48%);--gold:hsl(calc(var(--h)+58) 78% 70%)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Noto Sans Bengali",system-ui,sans-serif}body{overflow:hidden;color:#fff;background:hsl(var(--h) 55% 12%);transition:background 8s}.home{min-height:100svh;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 42%,hsl(calc(var(--h)+25) 70% 42%/.2),transparent 27%),radial-gradient(circle at 12% 15%,hsl(calc(var(--h)+55) 80% 60%/.16),transparent 32%),linear-gradient(145deg,hsl(var(--h) 60% 11%),hsl(calc(var(--h)+38) 58% 19%),hsl(calc(var(--h)+82) 52% 13%));transition:background 8s}.layer{position:absolute;border:1px solid #ffffff18;border-radius:50%;pointer-events:none}.l1{width:92vw;height:92vw;max-width:620px;max-height:620px;box-shadow:0 0 90px hsl(var(--h) 80% 60%/.12);animation:spin 35s linear infinite}.l2{width:70vw;height:70vw;max-width:470px;max-height:470px;border-style:dashed;animation:spin 28s linear infinite reverse}.l3{width:48vw;height:48vw;max-width:320px;max-height:320px;box-shadow:inset 0 0 45px hsl(calc(var(--h)+55) 80% 70%/.1);animation:pulse 5s ease-in-out infinite}.content{position:relative;z-index:5;text-align:center;width:min(500px,90%);padding-top:10vh}.title{font-size:clamp(28px,8vw,46px);font-weight:900;margin:0 0 8px;text-shadow:0 5px 28px #0008}.sub{opacity:.72;margin:0 0 28px;font-size:13px}.buttons{display:grid;gap:14px}.choice{position:relative;overflow:hidden;border:1px solid #ffffff45;border-radius:24px;min-height:76px;color:#fff;font:inherit;font-size:19px;font-weight:900;cursor:pointer;backdrop-filter:blur(16px);box-shadow:0 18px 50px #0005;transition:transform .25s}.choice:active{transform:scale(.96)}.read{background:linear-gradient(110deg,hsl(calc(var(--h)+15) 72% 38%/.96),hsl(calc(var(--h)+65) 78% 47%/.9),hsl(calc(var(--h)+25) 75% 39%/.96));background-size:220% 100%;animation:shinebg 4s ease-in-out infinite}.read:before{content:"";position:absolute;inset:-50%;background:linear-gradient(105deg,transparent 43%,#fff8 50%,transparent 57%);animation:sweep 3.4s ease-in-out infinite}.read span{position:relative;z-index:2}.read .icon{display:inline-block;animation:bookPulse 1.8s ease-in-out infinite}.research{background:#ffffff16}.reduce{min-height:42px;border-radius:18px;font-size:14px;background:#ffffff12;border-color:#ffffff30;box-shadow:0 10px 30px #0003;margin-top:4px}.robot{position:fixed;z-index:20;width:126px;height:150px;left:50%;top:22%;touch-action:none;cursor:grab;user-select:none;filter:drop-shadow(0 18px 28px #0007);animation:bob 3.2s ease-in-out infinite}.robot:active{cursor:grabbing}.head{position:absolute;left:10px;top:10px;width:106px;height:88px;border-radius:38% 38% 43% 43%;background:linear-gradient(145deg,#f7ffff,#b9dfe0);border:3px solid #ffffffaa;box-shadow:inset 0 -10px 18px #277a7a33,0 0 30px hsl(var(--h) 80% 65%/.35)}.eye{position:absolute;top:30px;width:19px;height:27px;border-radius:50%;background:#102a38;box-shadow:inset 5px 4px 0 #fff;animation:look 5s ease-in-out infinite,blink 6s infinite}.eye.left{left:24px}.eye.right{right:24px}.mouth{position:absolute;left:43px;top:61px;width:20px;height:10px;border-bottom:3px solid #214b58;border-radius:50%;animation:happy 4s ease-in-out infinite}.body{position:absolute;left:28px;top:91px;width:70px;height:53px;border-radius:22px 22px 28px 28px;background:linear-gradient(145deg,hsl(calc(var(--h)+25) 75% 56%),hsl(calc(var(--h)+60) 72% 45%));border:2px solid #ffffff66;box-shadow:0 0 22px hsl(var(--h) 80% 60%/.22)}.antenna{position:absolute;left:59px;top:-4px;width:8px;height:19px;background:#bde5e2}.antenna:after{content:"";position:absolute;left:-4px;top:-10px;width:16px;height:16px;border-radius:50%;background:var(--gold);box-shadow:0 0 20px var(--gold);animation:glow 1.5s infinite}.arm{position:absolute;top:101px;width:20px;height:45px;border-radius:15px;background:#c5e6e5}.arm.left{left:13px;transform:rotate(18deg);animation:wave 2.8s infinite}.arm.right{right:13px;transform:rotate(-18deg)}.heart{position:absolute;left:25px;top:8px;font-size:13px;animation:heart 1.6s infinite}@keyframes bob{50%{margin-top:-9px}}@keyframes look{0%,20%{transform:translateX(-4px)}35%,65%{transform:translateX(5px)}80%,100%{transform:translateX(-2px)}}@keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%,47%{transform:scaleY(.08)}}@keyframes happy{50%{width:27px;height:14px;left:39px}}@keyframes wave{50%{transform:rotate(34deg)}}@keyframes glow{50%{opacity:.45;transform:scale(.72)}}@keyframes heart{50%{transform:scale(1.3) rotate(8deg)}}@keyframes shinebg{50%{background-position:100% 0}}@keyframes sweep{0%{transform:translateX(-65%) rotate(12deg)}55%,100%{transform:translateX(65%) rotate(12deg)}}@keyframes bookPulse{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.13) rotate(-3deg)}}@keyframes pulse{50%{transform:scale(1.06);opacity:.7}}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:430px){.content{padding-top:13vh}.robot{transform:scale(.9);transform-origin:center}.choice{min-height:70px}.title{font-size:30px}}</style></head><body><main class="home"><div class="layer l1"></div><div class="layer l2"></div><div class="layer l3"></div><div class="robot" id="robot" aria-label="চঞ্চল AI রোবট"><div class="antenna"></div><div class="head"><div class="eye left"></div><div class="eye right"></div><div class="mouth"></div></div><div class="body"><span class="heart">✦</span></div><div class="arm left"></div><div class="arm right"></div></div><section class="content"><h1 class="title">আল-কুরআন গবেষণা</h1><p class="sub">পড়ুন, বুঝুন এবং ভাষাভিত্তিক গবেষণার পথে এগিয়ে যান</p><div class="buttons"><button class="choice read" onclick="location.href='index.html#quran'"><span><span class="icon">📖</span> কোরআন পড়ুন</span></button><button class="choice research" onclick="location.href='index.html#research'">🔎 &nbsp;গবেষণা করুন</button><button class="choice reduce" id="reduceBtn">↘️ রোবট কমান</button></div><div class="hint">রোবটটিকে টেনে যেখানে খুশি সেখানে নিন</div></section></main><script>const r=document.getElementById('robot');let drag=false,dx=0,dy=0;r.addEventListener('pointerdown',e=>{drag=true;r.setPointerCapture(e.pointerId);const q=r.getBoundingClientRect();dx=e.clientX-q.left;dy=e.clientY-q.top;r.style.animation='none'});r.addEventListener('pointermove',e=>{if(!drag)return;r.style.left=(e.clientX-dx)+'px';r.style.top=(e.clientY-dy)+'px';r.style.transform='none'});r.addEventListener('pointerup',()=>{drag=false;r.style.animation='bob 3.2s ease-in-out infinite'});document.getElementById('reduceBtn').addEventListener('click',()=>{r.style.animation='none';r.style.transform='scale(.6)';r.style.transformOrigin='center center'});const hues=[158,188,222,258,286,42];let i=0;setInterval(()=>{i=(i+1)%hues.length;document.documentElement.style.setProperty('--h',hues[i])},18000)</script></body></html>

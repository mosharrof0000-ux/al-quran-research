<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>রোবট কাজের পেজ — Page 2</title><style>:root{--h:158;--gold:hsl(calc(var(--h) + 58) 78% 70%)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;min-height:100%;font-family:"Noto Sans Bengali",system-ui,sans-serif}body{overflow:hidden;background:hsl(var(--h) 55% 12%);transition:background 8s}.home{width:100%;height:100%;min-height:100vh;min-height:100svh;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 42%,hsl(calc(var(--h)+25) 70% 42%/.2),transparent 27%),radial-gradient(circle at 12% 15%,hsl(calc(var(--h)+55) 80% 60%/.16),transparent 32%),linear-gradient(145deg,hsl(var(--h) 60% 11%),hsl(calc(var(--h)+38) 58% 19%),hsl(calc(var(--h)+82) 52% 13%));transition:background 8s}.layer{position:absolute;border:1px solid #ffffff18;border-radius:50%;pointer-events:none}.l1{width:92vw;height:92vw;max-width:620px;max-height:620px;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 0 90px hsl(var(--h) 80% 60%/.12);animation:spin 35s linear infinite}.l2{width:70vw;height:70vw;max-width:470px;max-height:470px;left:50%;top:50%;transform:translate(-50%,-50%);border-style:dashed;animation:spin 28s linear infinite reverse}.l3{width:48vw;height:48vw;max-width:320px;max-height:320px;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:inset 0 0 45px hsl(calc(var(--h)+55) 80% 70%/.1);animation:pulse 5s ease-in-out infinite}.robot{position:fixed;z-index:20;width:126px;height:150px;left:50%;top:22%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;filter:drop-shadow(0 18px 28px #0007);animation:bob 3.2s ease-in-out infinite;transform:scale(.7);transform-origin:top left;transition:transform .25s ease}.robot.touched{transform:scale(1)}.robot.dragging{cursor:grabbing;animation:none;transition:none}.robot.small{left:29%;top:39%;transform:scale(.3);transform-origin:top left;z-index:22;pointer-events:none}.robot.small.second{left:69%;top:39%}.robot.small.reacted{animation:react 1s ease-in-out,bob 3.2s ease-in-out infinite;transform:scale(.5) rotate(-7deg)}.robot.small.second.reacted{transform:scale(.5) rotate(7deg)}.banner{position:fixed;z-index:19;left:50%;top:55%;transform:translate(-50%,-50%);width:min(330px,70vw);display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;border:1px solid #ffffff45;border-radius:24px;background:#ffffff12;backdrop-filter:blur(16px);box-shadow:0 18px 50px #0005}.banner-choice{position:relative;min-height:64px;border:1px solid #ffffff35;border-radius:18px;color:#fff;font:inherit;font-size:16px;font-weight:900;text-align:center;background:#ffffff16;box-shadow:0 10px 28px #0004;transition:transform .25s}.banner-choice:active{transform:scale(.96)}.banner-read{background:linear-gradient(110deg,hsl(calc(var(--h)+15) 72% 38%/.96),hsl(calc(var(--h)+65) 78% 47%/.9),hsl(calc(var(--h)+25) 75% 39%/.96));background-size:220% 100%;animation:shinebg 4s ease-in-out infinite}.banner-choice span{position:relative;z-index:2}.head{position:absolute;left:10px;top:10px;width:106px;height:88px;border-radius:38% 38% 43% 43%;background:linear-gradient(145deg,#f7ffff,#b9dfe0);border:3px solid #ffffffaa;box-shadow:inset 0 -10px 18px #277a7a33,0 0 30px hsl(var(--h) 80% 65%/.35)}.eye{position:absolute;top:30px;width:19px;height:27px;border-radius:50%;background:#102a38;box-shadow:inset 5px 4px 0 #fff;animation:look 5s ease-in-out infinite,blink 6s infinite}.eye.left{left:24px}.eye.right{right:24px}.mouth{position:absolute;left:43px;top:61px;width:20px;height:10px;border-bottom:3px solid #214b58;border-radius:50%;animation:happy 4s ease-in-out infinite}.body{position:absolute;left:28px;top:91px;width:70px;height:53px;border-radius:22px 22px 28px 28px;background:linear-gradient(145deg,hsl(calc(var(--h)+25) 75% 56%),hsl(calc(var(--h)+60) 72% 45%));border:2px solid #ffffff66;box-shadow:0 0 22px hsl(var(--h) 80% 60%/.22)}.antenna{position:absolute;left:59px;top:-4px;width:8px;height:19px;background:#bde5e2}.antenna:after{content:"";position:absolute;left:-4px;top:-10px;width:16px;height:16px;border-radius:50%;background:var(--gold);box-shadow:0 0 20px var(--gold);animation:glow 1.5s infinite}.arm{position:absolute;top:101px;width:20px;height:45px;border-radius:15px;background:#c5e6e5}.arm.left{left:13px;transform:rotate(18deg);animation:wave 2.8s infinite}.arm.right{right:13px;transform:rotate(-18deg)}.heart{position:absolute;left:25px;top:8px;font-size:13px;animation:heart 1.6s infinite}@keyframes bob{50%{margin-top:-9px}}@keyframes look{0%,20%{transform:translateX(-4px)}35%,65%{transform:translateX(5px)}80%,100%{transform:translateX(-2px)}}@keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%,47%{transform:scaleY(.08)}}@keyframes happy{50%{width:27px;height:14px;left:39px}}@keyframes wave{50%{transform:rotate(34deg)}}@keyframes glow{50%{opacity:.45;transform:scale(.72)}}@keyframes heart{50%{transform:scale(1.3) rotate(8deg)}}@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.06);opacity:.7}}@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}@keyframes shinebg{50%{background-position:100% 0}}@keyframes react{0%{margin-top:0}25%{margin-top:-10px;rotate:-5deg}50%{margin-top:2px;rotate:5deg}75%{margin-top:-7px;rotate:-3deg}100%{margin-top:0;rotate:0}}@media(max-width:430px){.robot{transform:scale(.7);transform-origin:top left}.robot.touched{transform:scale(1)}.robot.small{left:27%;top:40%;transform:scale(.3);transform-origin:top left}.robot.small.second{left:67%;top:40%}.robot.small.reacted{transform:scale(.5) rotate(-7deg)}.robot.small.second.reacted{transform:scale(.5) rotate(7deg)}.banner{width:min(340px,82vw);top:54%;gap:7px;padding:8px}.banner-choice{min-height:58px;font-size:14px}}</style></head><body><main class="home"><div class="layer l1"></div><div class="layer l2"></div><div class="layer l3"></div><div class="robot" id="robot"><div class="antenna"></div><div class="head"><div class="eye left"></div><div class="eye right"></div><div class="mouth"></div></div><div class="body"><span class="heart">✦</span></div><div class="arm left"></div><div class="arm right"></div></div><div class="robot small" id="robotSmall"><div class="antenna"></div><div class="head"><div class="eye left"></div><div class="eye right"></div><div class="mouth"></div></div><div class="body"><span class="heart">✦</span></div><div class="arm left"></div><div class="arm right"></div></div><div class="robot small second" id="robotSmall2"><div class="antenna"></div><div class="head"><div class="eye left"></div><div class="eye right"></div><div class="mouth"></div></div><div class="body"><span class="heart">✦</span></div><div class="arm left"></div><div class="arm right"></div></div><div class="banner" aria-label="কাজের নির্বাচন"><button class="banner-choice banner-read" id="readButton"><span>📖 কোরআন পড়ুন</span></button><button class="banner-choice" id="researchButton"><span>🔎 গবেষণা করুন</span></button></div></main><script>const destinations={read:'index.html#quran',research:'index.html#research'};const bigRobot=document.getElementById('robot');const readRobot=document.getElementById('robotSmall');const researchRobot=document.getElementById('robotSmall2');let drag=false,dx=0,dy=0;bigRobot.addEventListener('pointerdown',e=>{drag=true;bigRobot.classList.add('dragging');const r=bigRobot.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top;bigRobot.setPointerCapture(e.pointerId);e.preventDefault()});bigRobot.addEventListener('pointermove',e=>{if(!drag)return;bigRobot.style.left=(e.clientX-dx)+'px';bigRobot.style.top=(e.clientY-dy)+'px';bigRobot.style.transform='scale(.7)';e.preventDefault()});function stopDrag(e){if(!drag)return;drag=false;bigRobot.classList.remove('dragging');try{bigRobot.releasePointerCapture(e.pointerId)}catch(_){}bigRobot.style.transform='scale(.7)'}bigRobot.addEventListener('pointerup',stopDrag);bigRobot.addEventListener('pointercancel',stopDrag);function reactThenGo(activeRobot,target){readRobot.classList.remove('reacted');researchRobot.classList.remove('reacted');void readRobot.offsetWidth;void researchRobot.offsetWidth;activeRobot.classList.add('reacted');setTimeout(()=>{location.href=target},850)}document.getElementById('readButton').addEventListener('click',()=>reactThenGo(readRobot,destinations.read));document.getElementById('researchButton').addEventListener('click',()=>reactThenGo(researchRobot,destinations.research));const hues=[158,188,222,258,286,42];let i=0;setInterval(()=>{i=(i+1)%hues.length;document.documentElement.style.setProperty('--h',hues[i])},18000)</script></body></html>

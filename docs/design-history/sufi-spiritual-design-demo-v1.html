<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>আল-কুরআন গবেষণা — সুফি আধ্যাত্মিক ডেমো v1</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif}body{color:#f8f5e9;background:#061711}
.scene{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 30%,#174d3a 0,#0b2b24 32%,#061711 72%)}
.glow{position:absolute;border-radius:50%;filter:blur(35px);opacity:.42;animation:float 10s ease-in-out infinite}.g1{width:260px;height:260px;left:-80px;top:10%;background:#4b8b63}.g2{width:300px;height:300px;right:-110px;bottom:8%;background:#8b7040;animation-delay:-4s}.g3{width:170px;height:170px;left:40%;bottom:-60px;background:#275f4b;animation-delay:-7s}
.stars{position:absolute;inset:0;background-image:radial-gradient(#d9c985 1px,transparent 1px);background-size:72px 72px;opacity:.16}
.moon{position:absolute;right:11%;top:9%;width:74px;height:74px;border-radius:50%;background:#f4e9b5;box-shadow:0 0 35px #e7d88b88}.moon:after{content:"";position:absolute;width:74px;height:74px;left:24px;top:-9px;border-radius:50%;background:#0b2b24}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.badge{padding:8px 16px;border:1px solid #d7c27a55;border-radius:999px;background:#ffffff08;backdrop-filter:blur(12px);font-size:13px;letter-spacing:1px;color:#e5d79c;margin-bottom:18px}.title{font-size:clamp(34px,8vw,70px);font-weight:800;line-height:1.05;margin:0;text-shadow:0 5px 30px #0008}.sub{margin:14px 0 30px;color:#d9dfd5;font-size:15px;max-width:500px;line-height:1.8}
.actions{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}.btn{min-width:190px;padding:16px 22px;border-radius:22px;border:1px solid #e6d58c55;color:#fff;font-size:17px;font-weight:800;background:linear-gradient(135deg,#1d6149aa,#17372fc0);box-shadow:0 14px 40px #0005;backdrop-filter:blur(15px);cursor:pointer;transition:.3s}.btn:hover{transform:translateY(-3px);box-shadow:0 18px 45px #0007}.btn.gold{background:linear-gradient(135deg,#806b32cc,#3d3824cc)}
.robot{position:absolute;left:50%;top:62%;width:105px;height:120px;transform:translateX(-50%);animation:robotFloat 4s ease-in-out infinite;filter:drop-shadow(0 15px 20px #0008);cursor:pointer}.head{position:absolute;left:14px;top:12px;width:77px;height:64px;border-radius:28px;background:linear-gradient(145deg,#dfe7df,#829e91);border:2px solid #ffffff55;box-shadow:inset 0 4px 8px #fff8,0 0 22px #7ac6a055}.antenna{position:absolute;left:50%;top:-18px;width:4px;height:22px;background:#d9c77c;transform:translateX(-50%)}.antenna:after{content:"";position:absolute;left:50%;top:-8px;width:13px;height:13px;border-radius:50%;background:#fff2a8;transform:translateX(-50%);box-shadow:0 0 8px #fff3a0,0 0 20px #d7bd58}.eye{position:absolute;top:27px;width:13px;height:17px;border-radius:50%;background:#10251e;box-shadow:inset 0 2px 3px #fff8}.e1{left:19px}.e2{right:19px}.body{position:absolute;left:20px;top:74px;width:65px;height:38px;border-radius:20px;background:linear-gradient(145deg,#799c8b,#395c50);border:2px solid #ffffff33}.arm{position:absolute;top:78px;width:12px;height:35px;border-radius:9px;background:#789889;transform-origin:top center}.a1{left:8px;transform:rotate(18deg);animation:arm1 1.7s ease-in-out infinite}.a2{right:8px;transform:rotate(-18deg);animation:arm2 1.7s ease-in-out infinite}.robot:active{transform:translateX(-50%) scale(1.15)}
.note{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);font-size:12px;color:#b8c8be;text-align:center;white-space:nowrap}.ring{position:absolute;left:50%;top:62%;width:155px;height:155px;border:1px solid #d8c47c22;border-radius:50%;transform:translate(-50%,-10%);animation:ring 5s linear infinite}
@keyframes float{50%{transform:translateY(-22px) translateX(12px)}}@keyframes robotFloat{50%{transform:translateX(-50%) translateY(-12px)}}@keyframes arm1{50%{transform:rotate(-18deg)}}@keyframes arm2{50%{transform:rotate(18deg)}}@keyframes ring{to{transform:translate(-50%,-10%) rotate(360deg)}}
@media(max-width:600px){.moon{right:7%;top:7%;width:55px;height:55px}.moon:after{width:55px;height:55px;left:18px}.center{padding-top:45px}.sub{font-size:14px;margin-bottom:24px}.btn{min-width:155px;padding:14px 16px;font-size:15px}.robot{top:64%}.ring{top:64%}.note{bottom:2%;font-size:11px}}
</style>
</head>
<body>
<div class="scene">
<div class="stars"></div><div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div><div class="moon"></div>
<div class="center">
<div class="badge">জ্ঞান • অনুসন্ধান • অন্তরের যাত্রা</div>
<h1 class="title">আল-কুরআন</h1>
<p class="sub">পড়ুন, বুঝুন এবং গবেষণা করুন — শান্ত, গভীর ও অনুসন্ধানী একটি জ্ঞানভ্রমণ।</p>
<div class="actions"><button class="btn" onclick="demo('কুরআন')">📖 কুরআন পড়ুন</button><button class="btn gold" onclick="demo('গবেষণা')">🔎 গবেষণা করুন</button></div>
</div>
<div class="ring"></div>
<div class="robot" onclick="demo('রোবট')"><div class="antenna"></div><div class="head"><span class="eye e1"></span><span class="eye e2"></span></div><div class="body"></div><div class="arm a1"></div><div class="arm a2"></div></div>
<div class="note">এটি নতুন সুফি-আধ্যাত্মিক ডিজাইন পরীক্ষামূলক ডেমো • কোনো পুরোনো লক করা পেজ পরিবর্তন করা হয়নি</div>
</div>
<script>function demo(x){document.body.animate([{opacity:.72},{opacity:1}],{duration:450});console.log(x+' ডেমো নির্বাচন করা হয়েছে')}</script>
</body>
</html>
